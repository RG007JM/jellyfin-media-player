name: Build Jellyfin Desktop (Qt6)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Removed "Install Vulkan SDK" (Not needed for forced OpenGL)
      # Removed "Download Ninja" (Pre-installed on windows-latest)
      # Removed "pip install reuse" (Unnecessary for Release build)

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebengine qtwebchannel qtmultimedia qtpositioning qtshadertools qt5compat qtimageformats qtserialport'

      - name: Download and Prepare Dependencies
        shell: powershell
        run: |
          $depDir = "$env:GITHUB_WORKSPACE\dep-install"
          $libDir = "$depDir\lib"
          $incDir = "$depDir\include"
          New-Item -ItemType Directory -Force -Path $libDir | Out-Null
          New-Item -ItemType Directory -Force -Path $incDir | Out-Null
          
          # --- 1. Libmpv ---
          Write-Host "Downloading Libmpv..."
          $mpvUrl = "https://sourceforge.net/projects/mpv-player-windows/files/libmpv/mpv-dev-x86_64-20240922-git-560413a.7z/download"
          Invoke-WebRequest -Uri $mpvUrl -OutFile "mpv-dev.7z"
          7z x mpv-dev.7z -o"$depDir" -y
          
          # Generate libmpv.lib from dll (Essential for MSVC linking)
          Write-Host "Generating libmpv.lib..."
          cd $libDir
          $vsPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          
          cmd.exe /c "call `"$vsPath`" && dumpbin /exports libmpv-2.dll > exports.txt"
          
          "LIBRARY libmpv-2.dll`r`nEXPORTS" | Out-File libmpv.def -Encoding ASCII
          Select-String -Path exports.txt -Pattern "^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(.+)" | ForEach-Object { $_.Matches.Groups[1].Value } | Out-File libmpv.def -Append -Encoding ASCII
          
          cmd.exe /c "call `"$vsPath`" && lib /def:libmpv.def /name:libmpv-2.dll /out:libmpv.lib /machine:x64"

          # --- 2. SDL2 ---
          Write-Host "Downloading SDL2..."
          cd "$env:GITHUB_WORKSPACE"
          $sdlUrl = "https://github.com/libsdl-org/SDL/releases/download/release-2.30.6/SDL2-devel-2.30.6-VC.zip"
          Invoke-WebRequest -Uri $sdlUrl -OutFile "sdl2.zip"
          7z x sdl2.zip -o"sdl_temp"
          Copy-Item "sdl_temp\SDL2-2.30.6\include\*" -Destination $incDir -Recurse
          Copy-Item "sdl_temp\SDL2-2.30.6\lib\x64\*" -Destination $libDir -Recurse

      - name: Patch main.cpp to Force OpenGL
        shell: powershell
        run: |
          # FIX: Replaced complex regex with robust string injection to avoid syntax errors (0x60)
          $path = "src/main.cpp"
          $txt = Get-Content $path -Raw
          
          # 1. Ensure Header exists
          if ($txt -notmatch "#include <QQuickWindow>") {
              $txt = "#include <QQuickWindow>`r`n" + $txt
          }
          
          # 2. Insert the setGraphicsApi call safely
          $search = "QGuiApplication app"
          $replacement = "QQuickWindow::setGraphicsApi(QSGRendererInterface::OpenGL);`r`n    QGuiApplication app"
          
          if ($txt -notmatch "setGraphicsApi") {
              # Use standard .Replace() which is safer than -replace regex operator for C++ code
              $txt = $txt.Replace($search, $replacement)
              Set-Content -Path $path -Value $txt
              Write-Host "Successfully patched main.cpp"
          } else {
              Write-Host "main.cpp already patched"
          }

      - name: Build Jellyfin Media Player
        shell: cmd
        env:
          CMAKE_PREFIX_PATH: ${{ env.GITHUB_WORKSPACE }}\dep-install;${{ env.Qt6_DIR }}
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          mkdir build
          cd build
          
          cmake -GNinja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="%GITHUB_WORKSPACE%\dep-install;%Qt6_DIR%" ^
            -DCMAKE_INSTALL_PREFIX="%GITHUB_WORKSPACE%\output" ^
            -DQT_QA_LIBRARY_BUILD_CONFIGURATION=Release ^
            -DBUILD_TESTING=OFF ^
            ..
          
          ninja
          ninja install

      - name: Deploy Libraries (Windows)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cd output
          
          :: Run windeployqt to copy Qt DLLs
          windeployqt --release --qmldir ..\src\qml JellyfinDesktop.exe
          
          :: Copy MPV and SDL dependencies manually
          copy "%GITHUB_WORKSPACE%\dep-install\lib\libmpv-2.dll" .
          copy "%GITHUB_WORKSPACE%\dep-install\lib\SDL2.dll" .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin-Desktop-Windows-Qt6-OpenGL
          path: output/
