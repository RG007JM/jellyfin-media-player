name: Build Qt6 Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - qt6

jobs:
  build-win64:
    runs-on: windows-latest

    env:
      #QSG_RHI_BACKEND: opengl
      QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox"

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Nuke MinGW and Path Contamination
      shell: pwsh
      run: |
        $path = $env:Path -split ';' | Where-Object { $_ -notmatch 'mingw' -and $_ -notmatch 'strawberry' }
        [Environment]::SetEnvironmentVariable("Path", ($path -join ';'), "Process")
        echo "Cleaned Path: $env:Path"

    - name: Prepare Libmpv (User Provided v3 URL)
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "dep-install/bin", "dep-install/lib", "dep-install/include"

        $url = "https://downloads.sourceforge.net/project/mpv-player-windows/libmpv/mpv-dev-x86_64-v3-20240922-git-71f2220.7z"
        Invoke-WebRequest -Uri $url -OutFile "mpv.7z" -UserAgent "curl/7.88.1" -MaximumRedirection 10

        7z x mpv.7z -ompv
        Set-Location mpv

        cmd.exe /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" && dumpbin /exports libmpv-2.dll > exports.txt"
        $defContent = @("LIBRARY libmpv-2.dll", "EXPORTS") + (Get-Content exports.txt | ForEach-Object { if ($_ -match "^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)") { $matches[1] } })
        $defContent | Set-Content libmpv-2.def
        cmd.exe /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" && lib /def:libmpv-2.def /out:libmpv.lib /MACHINE:X64"

        Copy-Item -Recurse -Force include\* ..\dep-install\include\
        Copy-Item libmpv.lib ..\dep-install\lib\
        Copy-Item libmpv-2.dll ..\dep-install\bin\

    - name: Install Qt 6.8.0
      uses: jurplel/install-qt-action@v4
      with:
        version: "6.8.0"
        arch: "win64_msvc2022_64"
        modules: "qtwebengine qtwebchannel qtmultimedia qtpositioning qtshadertools qt5compat qtimageformats qtserialport"

    - name: Setup Build Environment
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        if not exist dep-install\bin mkdir dep-install\bin
        if not exist dep-install\include mkdir dep-install\include
        if not exist dep-install\lib mkdir dep-install\lib

        curl -L https://github.com/ninja-build/ninja/releases/download/v1.10.2/ninja-win.zip -o ninja.zip
        tar -xf ninja.zip -C dep-install\bin
        del ninja.zip

        echo %GITHUB_WORKSPACE%\dep-install\bin>> %GITHUB_PATH%
        pip install reuse

    - name: Prepare SDL2
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://github.com/libsdl-org/SDL/releases/download/release-2.30.0/SDL2-devel-2.30.0-VC.zip" -OutFile "sdl2.zip"
        Expand-Archive "sdl2.zip" -DestinationPath "sdl2-temp" -Force
        $root = (Get-ChildItem "sdl2-temp" | Select-Object -First 1).FullName
        Copy-Item -Recurse -Force "$root\include\*" "dep-install\include\"
        Copy-Item -Force "$root\lib\x64\SDL2.lib" "dep-install\lib\"
        Copy-Item -Force "$root\lib\x64\SDL2main.lib" "dep-install\lib\"
        Copy-Item -Force "$root\lib\x64\SDL2.dll" "dep-install\bin\"

    - name: Prepare ECM and MpvQt
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        set "INSTALL_DIR=%GITHUB_WORKSPACE%\dep-install"
        set "INSTALL_DIR_FWD=%GITHUB_WORKSPACE:\=/%/dep-install"
        set "INCLUDE_DIR_FWD=%GITHUB_WORKSPACE:\=/%/dep-install/include"

        git clone https://github.com/KDE/extra-cmake-modules.git
        cd extra-cmake-modules
        cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="%INSTALL_DIR%"
        ninja -C build install
        cd ..

        git clone --branch v1.0.0 https://github.com/KDE/mpvqt.git
        cd mpvqt

        powershell -Command "$c = Get-Content src/mpvcontroller.h -Raw; $c = $c -replace '\s*virtual\s+~MpvController\(\).*?;', '' -replace '\s*~MpvController\(\).*?;', ''; $nl = [Environment]::NewLine; $c = $c.Replace('explicit MpvController(QObject *parent = nullptr);', 'explicit MpvController(QObject *parent = nullptr);' + $nl + '    virtual ~MpvController();'); Set-Content src/mpvcontroller.h $c"
        echo. >> src\mpvcontroller.cpp
        echo MpvController::~MpvController() = default; >> src\mpvcontroller.cpp

        cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="%INSTALL_DIR%" -DCMAKE_PREFIX_PATH="%INSTALL_DIR_FWD%;%Qt6_DIR%" -DECM_DIR="%INSTALL_DIR_FWD%/share/ECM/cmake" -DCMAKE_CXX_FLAGS="-I\"%INCLUDE_DIR_FWD%\""
        ninja -C build install
        cd ..

    - name: Download & Stage VC++ Redist and OpenSSL
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path bundle/win
        Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "bundle/win/vcredist_x64.exe"

        Invoke-WebRequest -Uri "https://download.firedaemon.com/FireDaemon-OpenSSL/openssl-3.6.0.zip" -OutFile "openssl.zip"
        Expand-Archive "openssl.zip" -DestinationPath "openssl-temp" -Force
        $binPath = (Get-ChildItem -Path "openssl-temp" -Recurse -Filter "libssl-3-x64.dll" | Select-Object -First 1).DirectoryName
        Copy-Item "$binPath\libssl-3-x64.dll" "dep-install\bin\"
        Copy-Item "$binPath\libcrypto-3-x64.dll" "dep-install\bin\"

    - name: Patch WiX Bundle.wxs
      shell: pwsh
      run: |
        $bundle  = "bundle/win/Bundle.wxs"
        if (Test-Path $bundle) {
          $c = Get-Content -Raw $bundle -Encoding UTF8
          $c = $c -replace 'Source=".*vcredist_x64.exe"', 'Source="bundle\win\vcredist_x64.exe"'
          $c = [regex]::Replace($c, 'C:\\Program Files \(x86\)\\Microsoft Visual Studio\\(2019|2022)\\BuildTools\\VC\\Redist\\MSVC\\[^"\\]+\\vcredist_x64\.exe', 'vcredist_x64.exe')
          Set-Content -LiteralPath $bundle -Value $c -Encoding UTF8
        }

    - name: Patch Source Code (Include Fix + GL Compat + Windows SMTC)
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        # 1) Patch src/CMakeLists.txt (remove linux-only components for Windows build)
        $cmakeFile = "src/CMakeLists.txt"
        $content = Get-Content $cmakeFile -Raw -Encoding UTF8
        $content = [System.Text.RegularExpressions.Regex]::Replace($content, '(?mi)^\s*add_subdirectory\(\s*taskbar\s*\)\s*$', '')
        $content = [System.Text.RegularExpressions.Regex]::Replace($content, '(?mi)^\s*add_subdirectory\(\s*mpris\s*\)\s*$', '')
        $content = $content.Replace('Qt6::DBus', '').Replace('Qt6::WinExtras', '')
        Set-Content $cmakeFile $content -Encoding UTF8

        # 2) Patch src/core/ComponentManager.cpp (remove includes/refs)
        $compMgr = "src/core/ComponentManager.cpp"
        $compContent = Get-Content $compMgr -Raw -Encoding UTF8
        $compContent = [System.Text.RegularExpressions.Regex]::Replace($compContent, '(?mi)^#include\s+.*MprisComponent\.h.*$', '')
        $compContent = [System.Text.RegularExpressions.Regex]::Replace($compContent, '(?mi)^#include\s+.*TaskbarComponent\.h.*$', '')
        $compContent = [System.Text.RegularExpressions.Regex]::Replace($compContent, '(?mi)^.*MprisComponent.*$', '')
        $compContent = [System.Text.RegularExpressions.Regex]::Replace($compContent, '(?mi)^.*TaskbarComponent.*$', '')
        Set-Content $compMgr $compContent -Encoding UTF8

        # 3) Patch src/ui/WindowManager.cpp (remove Taskbar usage)
        $winMgr = "src/ui/WindowManager.cpp"
        if (Test-Path $winMgr) {
          $winContent = Get-Content $winMgr -Raw -Encoding UTF8
          $winContent = [System.Text.RegularExpressions.Regex]::Replace($winContent, '(?mi)^.*TaskbarComponent.*$', '')
          Set-Content $winMgr $winContent -Encoding UTF8
        }

        # 4) CodecsComponent.cpp: ensure windows.h is included (idempotent)
        $codecs = "src/player/CodecsComponent.cpp"
        $cc = Get-Content $codecs -Raw -Encoding UTF8
        if ($cc -notmatch '#include\s+<windows\.h>') {
          $cc = '#include <windows.h>' + [Environment]::NewLine + $cc
          Set-Content $codecs $cc -Encoding UTF8
        }

        # 5) main.cpp: force Desktop OpenGL + CompatibilityProfile (idempotent)
        $main = "src/main.cpp"
        if (Test-Path $main) {
          $m = Get-Content $main -Raw -Encoding UTF8
          if ($m -notmatch "forceCompatOpenGL") {

            if ($m -notmatch '#include\s+<QSurfaceFormat>') { $m = "#include <QSurfaceFormat>`r`n" + $m }
            if ($m -notmatch '#include\s+<QCoreApplication>') { $m = "#include <QCoreApplication>`r`n" + $m }

            $fn = @(
              'static void forceCompatOpenGL()'
              '{'
              '    QCoreApplication::setAttribute(Qt::AA_UseDesktopOpenGL);'
              '    QCoreApplication::setAttribute(Qt::AA_ShareOpenGLContexts);'
              ''
              '    QSurfaceFormat fmt;'
              '    fmt.setRenderableType(QSurfaceFormat::OpenGL);'
              '    fmt.setVersion(3, 3);'
              '    fmt.setProfile(QSurfaceFormat::CompatibilityProfile);'
              '    fmt.setDepthBufferSize(24);'
              '    fmt.setStencilBufferSize(8);'
              '    QSurfaceFormat::setDefaultFormat(fmt);'
              '}'
              ''
              ''
            ) -join "`r`n"

            $rxMain = [System.Text.RegularExpressions.Regex]::new("(?m)^\s*int\s+main\s*\(")
            $m = $rxMain.Replace($m, $fn + "int main(", 1)

            $rxBrace = [System.Text.RegularExpressions.Regex]::new('(?s)(int\s+main\s*\([^\)]*\)\s*\{)')
            $m = $rxBrace.Replace($m, '$1' + "`r`n    forceCompatOpenGL();", 1)

            Set-Content $main $m -Encoding UTF8
          }
        }

        # 6) Windows SMTC injection (store WinRT object by value; PlayerComponent is NOT QObject => no QPointer)
          $hPath   = "src/player/WindowsSmtc.h"
          $cppPath = "src/player/WindowsSmtc.cpp"
          
          $h = @(
            '#pragma once'
            '#ifdef _WIN32'
            '#include <QVariantMap>'
            ''
            '#include <winrt/base.h>'
            '#include <winrt/Windows.Media.h>'
            ''
            'class PlayerComponent;'
            'class QQuickWindow;'
            ''
            'class WindowsSmtc'
            '{'
            'public:'
            '    WindowsSmtc() = default;'
            '    bool initForWindow(QQuickWindow* window, PlayerComponent* player);'
            '    void setPlaybackStatePlaying();'
            '    void setPlaybackStatePaused();'
            '    void setPlaybackStateStopped();'
            '    void setMetadata(const QVariantMap& metadata);'
            ''
            'private:'
            '    bool m_inited{false};'
            '    PlayerComponent* m_player{nullptr};'
            '    winrt::Windows::Media::SystemMediaTransportControls m_smtc{ nullptr };'
            '};'
            '#endif'
            ''
          ) -join "`r`n"
          Set-Content -Path $hPath -Value $h -Encoding UTF8
          
          $cpp = @(
            '#ifdef _WIN32'
            ''
            '#include "WindowsSmtc.h"'
            ''
            '#include <QQuickWindow>'
            '#include <QVariantMap>'
            '#include <QMetaObject>'
            ''
            '#include <windows.h>'
            ''
            'using namespace winrt;'
            'using namespace winrt::Windows::Media;'
            ''
            'struct __declspec(uuid("dd151aac-98d0-4e70-a75f-6f03f39f2b4a")) ISystemMediaTransportControlsInterop : ::IUnknown'
            '{'
            '    virtual HRESULT __stdcall GetForWindow(HWND appWindow, REFIID riid, void** result) = 0;'
            '};'
            ''
            'static HWND hwndFromQtWindow(QQuickWindow* w)'
            '{'
            '    return reinterpret_cast<HWND>(w ? w->winId() : 0);'
            '}'
            ''
            'bool WindowsSmtc::initForWindow(QQuickWindow* window, PlayerComponent* player)'
            '{'
            '    if (m_inited) return true;'
            '    m_player = player;'
            ''
            '    HWND hwnd = hwndFromQtWindow(window);'
            '    if (!hwnd) return false;'
            ''
            '    winrt::init_apartment(winrt::apartment_type::single_threaded);'
            ''
            '    auto interop = winrt::get_activation_factory<SystemMediaTransportControls, ISystemMediaTransportControlsInterop>();'
            '    SystemMediaTransportControls smtc{ nullptr };'
            '    winrt::check_hresult(interop->GetForWindow(hwnd, winrt::guid_of<SystemMediaTransportControls>(), winrt::put_abi(smtc)));'
            ''
            '    smtc.IsEnabled(true);'
            '    smtc.IsPlayEnabled(true);'
            '    smtc.IsPauseEnabled(true);'
            '    smtc.IsStopEnabled(true);'
            '    smtc.IsNextEnabled(true);'
            '    smtc.IsPreviousEnabled(true);'
            ''
            '    smtc.ButtonPressed([this](auto const&, SystemMediaTransportControlsButtonPressedEventArgs const& args) {'
            '        if (!m_player) return;'
            '        switch (args.Button()) {'
            '        case SystemMediaTransportControlsButton::Play:'
            '            QMetaObject::invokeMethod(m_player, "play", Qt::QueuedConnection); break;'
            '        case SystemMediaTransportControlsButton::Pause:'
            '            QMetaObject::invokeMethod(m_player, "pause", Qt::QueuedConnection); break;'
            '        case SystemMediaTransportControlsButton::Stop:'
            '            QMetaObject::invokeMethod(m_player, "stop", Qt::QueuedConnection); break;'
            '        case SystemMediaTransportControlsButton::Next:'
            '            QMetaObject::invokeMethod(m_player, "next", Qt::QueuedConnection); break;'
            '        case SystemMediaTransportControlsButton::Previous:'
            '            QMetaObject::invokeMethod(m_player, "previous", Qt::QueuedConnection); break;'
            '        default: break;'
            '        }'
            '    });'
            ''
            '    m_smtc = smtc;'
            '    m_inited = true;'
            '    return true;'
            '}'
            ''
            'void WindowsSmtc::setPlaybackStatePlaying() { if (!m_inited) return; m_smtc.PlaybackStatus(MediaPlaybackStatus::Playing); }'
            'void WindowsSmtc::setPlaybackStatePaused()  { if (!m_inited) return; m_smtc.PlaybackStatus(MediaPlaybackStatus::Paused);  }'
            'void WindowsSmtc::setPlaybackStateStopped() { if (!m_inited) return; m_smtc.PlaybackStatus(MediaPlaybackStatus::Stopped); }'
            ''
            'void WindowsSmtc::setMetadata(const QVariantMap& md)'
            '{'
            '    if (!m_inited) return;'
            '    auto updater = m_smtc.DisplayUpdater();'
            '    updater.Type(MediaPlaybackType::Music);'
            '    auto music = updater.MusicProperties();'
            ''
            '    const auto title  = md.value("title").toString();'
            '    const auto artist = md.value("artist").toString();'
            '    const auto album  = md.value("album").toString();'
            ''
            '    if (!title.isEmpty())  music.Title(title.toStdWString());'
            '    if (!artist.isEmpty()) music.Artist(artist.toStdWString());'
            '    if (!album.isEmpty())  music.AlbumTitle(album.toStdWString());'
            ''
            '    updater.Update();'
            '}'
            ''
            '#endif'
            ''
          ) -join "`r`n"
          Set-Content -Path $cppPath -Value $cpp -Encoding UTF8


        # 6b) Patch src/CMakeLists.txt to compile & link it into jmp_core (plain signature)
        $t = Get-Content $cmakeFile -Raw -Encoding UTF8
        if ($t -notmatch "CI PATCH: Windows SMTC") {
          $append = @(
            ''
            '# CI PATCH: Windows SMTC'
            'if(WIN32)'
            '  target_sources(jmp_core PRIVATE player/WindowsSmtc.cpp)'
            '  target_compile_features(jmp_core PRIVATE cxx_std_17)'
            '  target_link_libraries(jmp_core runtimeobject)'
            'endif()'
            ''
          ) -join "`r`n"
          $t += $append
          Set-Content $cmakeFile $t -Encoding UTF8
        }

        # 6c) Patch PlayerComponent.cpp (FORCE include at top, then declare g_smtc AFTER it)
        $pc = "src/player/PlayerComponent.cpp"
        if (Test-Path $pc) {
          $src = Get-Content $pc -Raw -Encoding UTF8

          $incBlock = @(
            '#ifdef _WIN32'
            '#include "WindowsSmtc.h"'
            '#endif'
            ''
          ) -join "`r`n"

          if ($src -notmatch 'WindowsSmtc\.h') {
            $bom = ""
            if ($src.Length -gt 0 -and [int]$src[0] -eq 0xFEFF) {
              $bom = [char]0xFEFF
              $src = $src.Substring(1)
            }
            $src = $bom + $incBlock + $src
          }

          if ($src -notmatch 'CI PATCH: SMTC instance') {
            $decl = @(
              '#ifdef _WIN32'
              '// CI PATCH: SMTC instance (workflow-injected)'
              'static WindowsSmtc* g_smtc = nullptr;'
              '#endif'
              ''
            ) -join "`r`n"

            $rxAfterInc = [System.Text.RegularExpressions.Regex]::new(
              '(?s)(#ifdef\s+_WIN32\r?\n#include\s+"WindowsSmtc\.h"\r?\n#endif\r?\n)'
            )
            if ($rxAfterInc.IsMatch($src)) {
              $src = $rxAfterInc.Replace($src, '$1' + $decl, 1)
            } else {
              $src = $decl + $src
            }
          }

          if ($src -notmatch 'CI PATCH: init SMTC') {
            $rxInit = [System.Text.RegularExpressions.Regex]::new(
              '(?s)(void\s+PlayerComponent::setWindow\s*\(\s*QQuickWindow\*\s*window\s*\)\s*\{.*?m_window\s*=\s*window;\s*)'
            )
            $insertInit = @(
              '#ifdef _WIN32'
              '  // CI PATCH: init SMTC'
              '  if (!g_smtc) g_smtc = new WindowsSmtc();'
              '  g_smtc->initForWindow(window, this);'
              '#endif'
              ''
            ) -join "`r`n"
            $src = $rxInit.Replace($src, '$1' + "`r`n" + $insertInit, 1)
          }

          if ($src -notmatch 'CI PATCH: SMTC signal wiring') {
            $wire = @(
              '#ifdef _WIN32'
              '  // CI PATCH: SMTC signal wiring'
              '  connect(this, &PlayerComponent::playing, this, []() { if (g_smtc) g_smtc->setPlaybackStatePlaying(); });'
              '  connect(this, &PlayerComponent::paused,  this, []() { if (g_smtc) g_smtc->setPlaybackStatePaused();  });'
              '  connect(this, &PlayerComponent::stopped, this, []() { if (g_smtc) g_smtc->setPlaybackStateStopped(); });'
              '  connect(this, &PlayerComponent::metadataChanged, this,'
              '          [](const QVariantMap& md, const QString&) { if (g_smtc) g_smtc->setMetadata(md); });'
              '#endif'
              ''
            ) -join "`r`n"

            $rxSetWindow = [System.Text.RegularExpressions.Regex]::new(
              '(?s)(void\s+PlayerComponent::setWindow\s*\(\s*QQuickWindow\*\s*window\s*\)\s*\{.*?\r?\n\})'
            )
            $src = $rxSetWindow.Replace($src, {
              param($m)
              $block = $m.Groups[1].Value
              return ($block -replace "\r?\n\}$", "`r`n$wire`r`n}")
            }, 1)
          }

          Set-Content -Path $pc -Value $src -Encoding UTF8
        }

        Write-Host "Source patched (includes + GL compat + SMTC)."

    - name: Build Jellyfin Desktop
      shell: pwsh
      run: |
        $root = (Get-Location).Path.Replace("\", "/")
        $depInstall = "$root/dep-install"
        $libMpv = "$depInstall/lib/libmpv.lib"
        $incMpv = "$depInstall/include"
        $mpvQtDir = "$depInstall/lib/cmake/MpvQt"
        $installPrefix = "$root/output"

        $cmakeMod = "CMakeModules/FindMPV.cmake"
        $overrideContent = @(
          'set(MPV_FOUND TRUE)'
          "set(MPV_INCLUDE_DIR `"$incMpv`")"
          "set(MPV_LIBRARY `"$libMpv`")"
          "set(MPV_LIBRARIES `"$libMpv`")"
          "set(MPV_INCLUDE_DIRS `"$incMpv`")"
          'if(NOT TARGET MPV::MPV)'
          '  add_library(MPV::MPV UNKNOWN IMPORTED)'
          "  set_target_properties(MPV::MPV PROPERTIES IMPORTED_LOCATION `"$libMpv`" INTERFACE_INCLUDE_DIRECTORIES `"$incMpv`")"
          'endif()'
        ) -join "`r`n"
        Set-Content -Path $cmakeMod -Value $overrideContent -Encoding UTF8

        cmd.exe /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" && cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=`"$installPrefix`" -DCMAKE_PREFIX_PATH=`"$depInstall;$env:Qt6_DIR`" -DMpvQt_DIR=`"$mpvQtDir`" ."
        if ($LASTEXITCODE -ne 0) { exit 1 }

        Set-Location build
        cmd.exe /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" && ninja install"

    - name: Deploy Qt and Finalize
      shell: pwsh
      run: |
        $outDir = "$((Get-Location).Path)/output"
        $depInstall = "$((Get-Location).Path)/dep-install"
        if (-not (Test-Path $outDir)) { throw "Output directory missing!" }

        $qtBin = $env:Qt6_DIR + "/bin"
        if (-not (Test-Path $qtBin)) {
          $windeploy = Get-Command windeployqt -ErrorAction SilentlyContinue
          if ($windeploy) {
            $qtBin = $windeploy.Source | Split-Path | Split-Path
            $qtBin = "$qtBin/bin"
          } else {
            $qtBin = "D:/a/jellyfin-media-player/Qt/6.8.0/msvc2022_64/bin"
          }
        }
        Write-Host "Detected Qt Bin Path: $qtBin"
        $qtRoot = Split-Path $qtBin -Parent

        Write-Host "Forcing Qt DLL copy..."
        $qtDlls = @(
          "Qt6Core.dll","Qt6Gui.dll","Qt6Widgets.dll","Qt6Network.dll",
          "Qt6Quick.dll","Qt6Qml.dll","Qt6Svg.dll","Qt6OpenGL.dll",
          "Qt6QmlModels.dll","Qt6QmlWorkerScript.dll",
          "Qt6WebEngineCore.dll","Qt6WebEngineQuick.dll"
        )
        foreach ($q in $qtDlls) {
          $src = "$qtBin\$q"
          if (Test-Path $src) { Copy-Item -Force $src $outDir } else { Write-Warning "Could not find $src" }
        }

        Write-Host "Manually copying WebEngine Resources..."
        $resSrc = "$qtRoot/resources"
        if (Test-Path $resSrc) {
          New-Item -ItemType Directory -Force -Path "$outDir/resources" | Out-Null
          Copy-Item -Force -Recurse "$resSrc\*" "$outDir/resources"
        }
        $processExe = "$qtBin\QtWebEngineProcess.exe"
        if (Test-Path $processExe) { Copy-Item -Force $processExe $outDir }

        Copy-Item -Force "$depInstall/bin/*.dll" $outDir

        $exePath = "$outDir/Jellyfin Desktop.exe"
        $qmlArgs = @()
        if (Test-Path "$depInstall/lib/qml") { $qmlArgs += "--qmlimport"; $qmlArgs += "$depInstall/lib/qml" }
        & "windeployqt" --release --force --qmldir src/ui @qmlArgs --compiler-runtime --xml "$exePath"

        Remove-Item -Force -ErrorAction SilentlyContinue "$outDir\qt.conf"
        Remove-Item -Force -ErrorAction SilentlyContinue "$outDir\.qt.conf"

        $vcRoot = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC"
        $runtimeDll = Get-ChildItem -Path $vcRoot -Recurse -Filter "vcruntime140.dll" | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
        if ($runtimeDll) {
          $redistDir = $runtimeDll.DirectoryName
          Copy-Item -Force "$redistDir\*.dll" $outDir
        }

        Get-ChildItem $outDir | Select-Object Name

    - name: Create Portable Zip
      shell: pwsh
      run: Compress-Archive -Path output\* -DestinationPath Jellyfin-Desktop-Portable.zip

    - name: Upload Portable Zip
      uses: actions/upload-artifact@v4
      with:
        name: jellyfin-desktop-portable
        path: Jellyfin-Desktop-Portable.zip

    - name: Build Installer Package
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        set PATH=%PATH%;C:\Program Files (x86)\WiX Toolset v3.11\bin
        cd build
        ninja windows_package

    - name: Archive installer
      uses: actions/upload-artifact@v4
      with:
        name: jellyfin-desktop-windows
        path: build/JellyfinDesktop-*.exe
