name: Build Qt6 Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - qt6

jobs:
  build-win64:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Qt 6.8.0
      uses: jurplel/install-qt-action@v4
      with:
        version: "6.8.0"
        arch: "win64_msvc2022_64"
        modules: "qtwebengine qtwebchannel qtmultimedia qtpositioning qtshadertools qt5compat qtimageformats"

    - name: Setup Build Environment (Ninja, Dirs, Reuse)
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        mkdir build
        mkdir dep-install
        mkdir dep-install\include
        mkdir dep-install\lib
        mkdir dep-install\bin
        
        rem Download Ninja
        curl -L https://github.com/ninja-build/ninja/releases/download/v1.10.2/ninja-win.zip -o ninja.zip
        tar -xf ninja.zip -C dep-install\bin
        del ninja.zip
        
        rem Add dep-install\bin to PATH
        echo %GITHUB_WORKSPACE%\dep-install\bin>> %GITHUB_PATH%
        
        rem Install Reuse Tool
        pip install reuse

    - name: Install Vulkan SDK
      shell: pwsh
      run: |
        $url = "https://sdk.lunarg.com/sdk/download/1.3.296.0/windows/VulkanSDK-1.3.296.0-Installer.exe"
        $out = "VulkanSDK.exe"
        
        Write-Host "Downloading Vulkan SDK..."
        Invoke-WebRequest -Uri $url -OutFile $out -UserAgent "curl/7.88.1"
        
        Write-Host "Installing Vulkan SDK..."
        Start-Process -FilePath .\$out -ArgumentList "--root C:\VulkanSDK --accept-licenses --default-answer --confirm-command install" -Wait
        
        if (Test-Path "C:\VulkanSDK\Bin") {
            $sdkRoot = "C:\VulkanSDK"
        } else {
            $sdkRoot = Get-ChildItem "C:\VulkanSDK" | Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
        }
        
        echo "VULKAN_SDK=$sdkRoot" >> $env:GITHUB_ENV
        echo "VK_SDK_PATH=$sdkRoot" >> $env:GITHUB_ENV
        echo "$sdkRoot\Bin" >> $env:GITHUB_PATH
        echo "$sdkRoot\Include" >> $env:GITHUB_PATH
        Remove-Item $out

    - name: Prepare Libmpv
      shell: pwsh
      run: |
        $url = "https://downloads.sourceforge.net/project/mpv-player-windows/libmpv/mpv-dev-x86_64-v3-20251214-git-f7be2ee.7z"
        Invoke-WebRequest -Uri $url -OutFile "mpv.7z" -UserAgent "curl/7.88.1" -MaximumRedirection 5
        
        if ((Get-Item "mpv.7z").Length -lt 1000000) { throw "Download failed" }
        
        7z x mpv.7z -ompv
        Set-Location mpv
        
        cmd.exe /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" && dumpbin /exports libmpv-2.dll > exports.txt"
        $defContent = @("LIBRARY libmpv-2.dll", "EXPORTS")
        $lines = Get-Content exports.txt
        foreach ($line in $lines) {
            if ($line -match "^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)") {
                $defContent += $matches[1]
            }
        }
        $defContent | Set-Content libmpv-2.def
        cmd.exe /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" && lib /def:libmpv-2.def /out:libmpv.lib /MACHINE:X64"
        
        Copy-Item -Recurse -Force include\* ..\dep-install\include\
        Copy-Item libmpv.lib ..\dep-install\lib\
        Copy-Item libmpv-2.dll ..\dep-install\bin\

    - name: Prepare SDL2
      shell: pwsh
      run: |
        $url = "https://github.com/libsdl-org/SDL/releases/download/release-2.30.0/SDL2-devel-2.30.0-VC.zip"
        Invoke-WebRequest -Uri $url -OutFile "sdl2.zip"
        Expand-Archive -Path "sdl2.zip" -DestinationPath "sdl2-temp" -Force
        $root = Get-ChildItem "sdl2-temp" | Select-Object -First 1
        
        Copy-Item -Recurse -Force "$($root.FullName)\include\*" "dep-install\include\"
        Copy-Item -Force "$($root.FullName)\lib\x64\SDL2.lib" "dep-install\lib\"
        Copy-Item -Force "$($root.FullName)\lib\x64\SDL2main.lib" "dep-install\lib\"
        Copy-Item -Force "$($root.FullName)\lib\x64\SDL2.dll" "dep-install\bin\"
        Remove-Item -Recurse -Force "sdl2-temp"
        Remove-Item "sdl2.zip"

    - name: Prepare ECM and MpvQt
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        set "INSTALL_DIR=%GITHUB_WORKSPACE%\dep-install"
        set "INSTALL_DIR_FWD=%GITHUB_WORKSPACE:\=/%/dep-install"
        
        git clone https://github.com/KDE/extra-cmake-modules.git
        cd extra-cmake-modules
        cmake -B build -GNinja -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_INSTALL_PREFIX="%INSTALL_DIR%"
        if %errorlevel% neq 0 exit /b %errorlevel%
        ninja -C build install
        if %errorlevel% neq 0 exit /b %errorlevel%
        cd ..
        
        git clone --branch v1.0.0 https://github.com/KDE/mpvqt.git
        cd mpvqt
        
        powershell -Command "$c = Get-Content src/mpvcontroller.h -Raw; $c = $c -replace '\s*virtual\s+~MpvController\(\).*?;', '' -replace '\s*~MpvController\(\).*?;', ''; $nl = [Environment]::NewLine; $c = $c.Replace('explicit MpvController(QObject *parent = nullptr);', 'explicit MpvController(QObject *parent = nullptr);' + $nl + '    virtual ~MpvController();'); Set-Content src/mpvcontroller.h $c"
        echo. >> src\mpvcontroller.cpp
        echo MpvController::~MpvController() = default; >> src\mpvcontroller.cpp
        
        cmake -B build -GNinja ^
          -DCMAKE_C_COMPILER=cl ^
          -DCMAKE_CXX_COMPILER=cl ^
          -DCMAKE_INSTALL_PREFIX="%INSTALL_DIR%" ^
          -DCMAKE_PREFIX_PATH="%INSTALL_DIR_FWD%;%Qt6_DIR%" ^
          -DECM_DIR="%INSTALL_DIR_FWD%/share/ECM/cmake" ^
          -DCMAKE_CXX_FLAGS="-I%INSTALL_DIR_FWD%/include -EHsc"
        if %errorlevel% neq 0 exit /b %errorlevel%
        ninja -C build install
        if %errorlevel% neq 0 exit /b %errorlevel%
        cd ..

    - name: Download & Stage VC++ Redist and OpenSSL 3
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path bundle/win
        
        $vcUrl = "https://aka.ms/vs/17/release/vc_redist.x64.exe"
        Invoke-WebRequest -Uri $vcUrl -OutFile "vc_redist.x64.exe" -UserAgent "curl/7.88.1"
        Copy-Item "vc_redist.x64.exe" "bundle/win/vcredist_x64.exe"
        
        $sslUrl = "https://download.firedaemon.com/FireDaemon-OpenSSL/openssl-3.6.0.zip"
        $zipPath = "openssl.zip"
        Invoke-WebRequest -Uri $sslUrl -OutFile $zipPath -UserAgent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
        Expand-Archive -Path $zipPath -DestinationPath "openssl-temp" -Force
        
        $binPath = Get-ChildItem -Path "openssl-temp" -Recurse -Filter "libssl-3-x64.dll" | Select-Object -First 1 | Split-Path -Parent
        Copy-Item "$binPath\libssl-3-x64.dll" "dep-install\bin\"
        Copy-Item "$binPath\libcrypto-3-x64.dll" "dep-install\bin\"
        Remove-Item -Recurse -Force "openssl-temp"
        Remove-Item -Force $zipPath

    - name: Patch WiX Bundle.wxs
      shell: pwsh
      run: |
        $bundle  = "bundle/win/Bundle.wxs"
        if (Test-Path $bundle) {
            $c = Get-Content -Raw $bundle -Encoding UTF8
            $c = $c -replace 'Source=".*vcredist_x64.exe"', 'Source="bundle\win\vcredist_x64.exe"'
            $c = [regex]::Replace($c, 'C:\\Program Files \(x86\)\\Microsoft Visual Studio\\(2019|2022)\\BuildTools\\VC\\Redist\\MSVC\\[^"\\]+\\vcredist_x64\.exe', 'vcredist_x64.exe')
            Set-Content -LiteralPath $bundle -Value $c -Encoding UTF8
        }

    - name: Build Jellyfin Desktop
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        set PATH=%PATH%;C:\Program Files (x86)\WiX Toolset v3.11\bin
        
        rem --- PATCH 1: Remove MprisComponent (Fixes QtDBus Error) ---
        powershell -Command "$f='src/CMakeLists.txt'; $c=Get-Content $f; $c | Where-Object { $_ -notmatch 'mpris/MprisComponent' -and $_ -notmatch 'add_subdirectory.mpris.' -and $_ -notmatch 'Qt6::DBus' } | Set-Content $f"
        powershell -Command "$f='src/core/ComponentManager.cpp'; $c=Get-Content $f; $c | Where-Object { $_ -notmatch 'MprisComponent' } | Set-Content $f"
        if exist src\mpris rmdir /s /q src\mpris
        
        rem --- PATCH 2: Disable TaskbarComponent (Fixes QWinTaskbarButton Error) ---
        powershell -Command "$f='src/CMakeLists.txt'; $c=Get-Content $f; $c | Where-Object { $_ -notmatch 'taskbar' -and $_ -notmatch 'TaskbarComponent' } | Set-Content $f"
        powershell -Command "$f='src/core/ComponentManager.cpp'; $c=Get-Content $f; $c | Where-Object { $_ -notmatch 'TaskbarComponent' } | Set-Content $f"
        powershell -Command "$f='src/ui/WindowManager.cpp'; $c=Get-Content $f; $c | Where-Object { $_ -notmatch 'TaskbarComponent' -and $_ -notmatch 'm_taskbar' } | Set-Content $f"
        if exist src\taskbar rmdir /s /q src\taskbar
        
        rem --- PATCH 3: Disable Tests for Removed Components ---
        powershell -Command "if (Test-Path tests/CMakeLists.txt) { $f='tests/CMakeLists.txt'; $c=Get-Content $f; $c | Where-Object { $_ -notmatch 'TaskbarComponent' -and $_ -notmatch 'MprisComponent' } | Set-Content $f }"
        
        rem --- PATCH 4: Add windows.h to CodecsComponent.cpp ---
        powershell -Command "$f='src/player/CodecsComponent.cpp'; $c=Get-Content $f -Raw; $c='#include <windows.h>' + [Environment]::NewLine + $c; Set-Content $f $c"

        cd build
        
        set "DEP_INSTALL=%GITHUB_WORKSPACE%\dep-install"
        set "DEP_INSTALL_FWD=%GITHUB_WORKSPACE:\=/%/dep-install"
        
        for /f "delims=" %%i in ('dir /s /b "%DEP_INSTALL%\MpvQtConfig.cmake"') do set MPVQT_CONFIG_PATH=%%~dpi
        if defined MPVQT_CONFIG_PATH set MPVQT_DIR=%MPVQT_CONFIG_PATH%
        
        for /f "delims=" %%i in ('dir /s /b "%DEP_INSTALL%\ECMConfig.cmake"') do set ECM_CONFIG_PATH=%%~dpi
        if defined ECM_CONFIG_PATH set ECM_DIR=%ECM_CONFIG_PATH%
        
        cmake -GNinja ^
          -DCMAKE_C_COMPILER=cl ^
          -DCMAKE_CXX_COMPILER=cl ^
          -DCMAKE_BUILD_TYPE=RelWithDebInfo ^
          -DCMAKE_INSTALL_PREFIX=output ^
          -DCMAKE_PREFIX_PATH="%DEP_INSTALL_FWD%;%Qt6_DIR%" ^
          -DMpvQt_DIR="%MPVQT_DIR%" ^
          -DECM_DIR="%ECM_DIR%" ^
          -DQTROOT="%Qt6_DIR%" ^
          -DMPV_INCLUDE_DIR="%DEP_INSTALL_FWD%/include" ^
          -DMPV_LIBRARY="%DEP_INSTALL_FWD%/lib/libmpv.lib" ^
          -DSDL2_INCLUDE_DIR="%DEP_INSTALL_FWD%/include" ^
          -DSDL2_LIBRARY="%DEP_INSTALL_FWD%/lib/SDL2.lib" ^
          ..
        
        ninja
        
        echo Running Tests...
        set QT_QPA_PLATFORM=offscreen
        ctest -V
        
        ninja install
        
        echo Deploying Qt...
        %Qt6_DIR%\bin\windeployqt.exe --release --qmldir ..\src\ui --xml "output\Jellyfin Desktop.exe"
        
        copy "%DEP_INSTALL%\bin\libssl-3-x64.dll" output\
        copy "%DEP_INSTALL%\bin\libcrypto-3-x64.dll" output\
        copy "%DEP_INSTALL%\bin\libmpv-2.dll" output\
        copy "%DEP_INSTALL%\bin\SDL2.dll" output\
        
        ninja windows_package

    - name: Archive installer
      uses: actions/upload-artifact@v4
      with:
        name: jellyfin-desktop-windows
        path: ${{ github.workspace }}/build/JellyfinDesktop-*.exe
