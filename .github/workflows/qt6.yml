name: Build Qt6 Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - qt6

jobs:
  build-win64:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Qt 6.8.0
      uses: jurplel/install-qt-action@v4
      with:
        version: "6.8.0"
        arch: "win64_msvc2022_64"
        modules: "qtwebengine qtwebchannel qtmultimedia qtpositioning qtshadertools qt5compat qtimageformats qtserialport"

    - name: Setup Build Environment
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        mkdir dep-install\bin
        mkdir dep-install\include
        mkdir dep-install\lib
        
        curl -L https://github.com/ninja-build/ninja/releases/download/v1.10.2/ninja-win.zip -o ninja.zip
        tar -xf ninja.zip -C dep-install\bin
        del ninja.zip
        
        echo %GITHUB_WORKSPACE%\dep-install\bin>> %GITHUB_PATH%
        pip install reuse

    - name: Install Vulkan SDK
      shell: pwsh
      run: |
        $url = "https://sdk.lunarg.com/sdk/download/1.3.296.0/windows/VulkanSDK-1.3.296.0-Installer.exe"
        Invoke-WebRequest -Uri $url -OutFile "VulkanSDK.exe"
        Start-Process -FilePath .\VulkanSDK.exe -ArgumentList "--root C:\VulkanSDK --accept-licenses --default-answer --confirm-command install" -Wait
        $sdkRoot = "C:\VulkanSDK"
        echo "VULKAN_SDK=$sdkRoot" >> $env:GITHUB_ENV
        echo "VK_SDK_PATH=$sdkRoot" >> $env:GITHUB_ENV
        echo "$sdkRoot\Bin" >> $env:GITHUB_PATH
        Remove-Item VulkanSDK.exe

    - name: Prepare Dependencies
      shell: pwsh
      run: |
        # Libmpv
        Invoke-WebRequest "https://downloads.sourceforge.net/project/mpv-player-windows/libmpv/mpv-dev-x86_64-v3-20251214-git-f7be2ee.7z" -OutFile mpv.7z
        7z x mpv.7z -ompv
        Set-Location mpv
        cmd.exe /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" && dumpbin /exports libmpv-2.dll > exports.txt"
        $def = @("LIBRARY libmpv-2.dll", "EXPORTS") + (Get-Content exports.txt | Select-String "^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)" | ForEach-Object { $_.Matches.Groups[1].Value })
        $def | Set-Content libmpv-2.def
        cmd.exe /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" && lib /def:libmpv-2.def /out:libmpv.lib /MACHINE:X64"
        Copy-Item -Recurse include\* ..\dep-install\include\
        Copy-Item libmpv.lib ..\dep-install\lib\
        Copy-Item libmpv-2.dll ..\dep-install\bin\
        Set-Location ..

        # SDL2
        Invoke-WebRequest "https://github.com/libsdl-org/SDL/releases/download/release-2.30.0/SDL2-devel-2.30.0-VC.zip" -OutFile sdl2.zip
        Expand-Archive sdl2.zip -Dest sdl2-temp
        $sdlRoot = (Get-ChildItem sdl2-temp).FullName
        Copy-Item -Recurse "$sdlRoot\include\*" dep-install\include\
        Copy-Item "$sdlRoot\lib\x64\SDL2.lib" dep-install\lib\
        Copy-Item "$sdlRoot\lib\x64\SDL2main.lib" dep-install\lib\
        Copy-Item "$sdlRoot\lib\x64\SDL2.dll" dep-install\bin\
        Remove-Item -Recurse sdl2-temp, sdl2.zip

        # OpenSSL
        Invoke-WebRequest "https://download.firedaemon.com/FireDaemon-OpenSSL/openssl-3.6.0.zip" -OutFile openssl.zip
        Expand-Archive openssl.zip -Dest openssl-temp
        $sslBin = (Get-ChildItem -Path openssl-temp -Recurse -Filter "libssl-3-x64.dll").DirectoryName
        Copy-Item "$sslBin\libssl-3-x64.dll", "$sslBin\libcrypto-3-x64.dll" dep-install\bin\
        Remove-Item -Recurse openssl-temp, openssl.zip

    - name: Build MpvQt
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        set "INSTALL_DIR=%GITHUB_WORKSPACE%\dep-install"
        set "INSTALL_DIR_FWD=%GITHUB_WORKSPACE:\=/%/dep-install"
        
        git clone https://github.com/KDE/extra-cmake-modules.git
        cmake -S extra-cmake-modules -B build-ecm -GNinja -DCMAKE_INSTALL_PREFIX="%INSTALL_DIR%"
        ninja -C build-ecm install
        
        git clone --branch v1.0.0 https://github.com/KDE/mpvqt.git
        cd mpvqt
        powershell -Command "$c = Get-Content src/mpvcontroller.h -Raw; $c = $c.Replace('explicit MpvController(QObject *parent = nullptr);', 'explicit MpvController(QObject *parent = nullptr);' + [Environment]::NewLine + '    virtual ~MpvController();'); Set-Content src/mpvcontroller.h $c"
        echo MpvController::~MpvController() = default; >> src\mpvcontroller.cpp
        
        cmake -B build -GNinja -DCMAKE_INSTALL_PREFIX="%INSTALL_DIR%" -DCMAKE_PREFIX_PATH="%INSTALL_DIR_FWD%;%Qt6_DIR%" -DECM_DIR="%INSTALL_DIR_FWD%/share/ECM/cmake" -DCMAKE_CXX_FLAGS="-I\"%INSTALL_DIR_FWD%/include\""
        ninja -C build install

    - name: Configure and Build Jellyfin Desktop
      shell: pwsh
      run: |
        $root = (Get-Location).Path.Replace("\", "/")
        $dep = "$root/dep-install"
        
        # Override FindMPV
        $cmakeMod = "CMakeModules/FindMPV.cmake"
        @"
        set(MPV_FOUND TRUE)
        set(MPV_INCLUDE_DIR "$dep/include")
        set(MPV_LIBRARY "$dep/lib/libmpv.lib")
        set(MPV_LIBRARIES "$dep/lib/libmpv.lib")
        set(MPV_INCLUDE_DIRS "$dep/include")
        if(NOT TARGET MPV::MPV)
          add_library(MPV::MPV UNKNOWN IMPORTED)
          set_target_properties(MPV::MPV PROPERTIES IMPORTED_LOCATION "$dep/lib/libmpv.lib" INTERFACE_INCLUDE_DIRECTORIES "$dep/include")
        endif()
        "@ | Set-Content $cmakeMod

        $f='src/player/CodecsComponent.cpp'
        Set-Content $f ("#include <windows.h>`n" + (Get-Content $f -Raw))

        cmd.exe /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" && cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=`"$root/output`" -DCMAKE_PREFIX_PATH=`"$dep;$env:Qt6_DIR`" -DMpvQt_DIR=`"$dep/lib/cmake/MpvQt`" ."
        cmd.exe /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" && ninja -C build"

    - name: Install and Deploy (Final Fix)
      shell: pwsh
      run: |
        # 1. Force Install
        cmd.exe /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" && ninja -C build install"
        
        $outDir = "$((Get-Location).Path)/output"
        $depBin = "dep-install/bin"
        
        # 2. Windeployqt with QML
        $qmlDir = "dep-install/lib/qml"
        if (-not (Test-Path $qmlDir)) { $qmlDir = "dep-install/qml" }
        Write-Host "QML Source: $qmlDir"
        & "windeployqt" --release --force --qmldir src/ui --qmlimport "$qmlDir" --compiler-runtime --no-opengl-sw --xml "$outDir/Jellyfin Desktop.exe"

        # 3. VCRedist
        $vcRoot = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC"
        $dllSrc = Get-ChildItem -Path $vcRoot -Recurse -Filter "vcruntime140.dll" | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
        copy "$($dllSrc.DirectoryName)/*.dll" $outDir -Force

        # 4. Deps
        $deps = @("libssl-3-x64.dll", "libcrypto-3-x64.dll", "libmpv-2.dll", "SDL2.dll", "MpvQt.dll")
        foreach ($d in $deps) { copy "$depBin/$d" $outDir -Force }

        # 5. QT Safety Copy
        $qtBin = "$env:Qt6_DIR/bin"
        $qtDlls = @("Qt6Core.dll", "Qt6Gui.dll", "Qt6Quick.dll", "Qt6Widgets.dll", "Qt6Network.dll", "Qt6OpenGL.dll", "Qt6Qml.dll", "Qt6QmlModels.dll", "Qt6QmlWorkerScript.dll", "Qt6Svg.dll")
        foreach ($q in $qtDlls) {
            if (-not (Test-Path "$outDir/$q")) { copy "$qtBin/$q" $outDir -Force }
        }

        # 6. VERIFY
        if (Test-Path "$outDir/Qt6Quick.dll") { Write-Host "SUCCESS: Qt6Quick.dll present." }
        else { Write-Error "FAILED: Qt6Quick.dll missing." }

    - name: Create Portable Release
      shell: pwsh
      run: Compress-Archive -Path output\* -DestinationPath Jellyfin-Desktop-Portable.zip

    - name: Upload Portable Zip
      uses: actions/upload-artifact@v4
      with:
        name: jellyfin-desktop-portable
        path: Jellyfin-Desktop-Portable.zip

    - name: Build Installer (Attempt)
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        set PATH=%PATH%;C:\Program Files (x86)\WiX Toolset v3.11\bin
        cd build
        ninja windows_package

    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: jellyfin-desktop-installer
        path: build/JellyfinDesktop-*.exe
