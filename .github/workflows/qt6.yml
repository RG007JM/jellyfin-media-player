name: Build Qt6 Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - qt6

jobs:
  build-win64:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Qt 6.8.0
      uses: jurplel/install-qt-action@v4
      with:
        version: "6.8.0"
        arch: "win64_msvc2022_64"
        modules: "qtwebengine qtwebchannel qtmultimedia qtpositioning qtshadertools qt5compat qtimageformats qtserialport"

    - name: Setup Build Environment
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        mkdir dep-install\bin
        mkdir dep-install\include
        mkdir dep-install\lib
        
        curl -L https://github.com/ninja-build/ninja/releases/download/v1.10.2/ninja-win.zip -o ninja.zip
        tar -xf ninja.zip -C dep-install\bin
        del ninja.zip
        
        echo %GITHUB_WORKSPACE%\dep-install\bin>> %GITHUB_PATH%
        pip install reuse

    - name: Install Vulkan SDK
      shell: pwsh
      run: |
        $url = "https://sdk.lunarg.com/sdk/download/1.3.296.0/windows/VulkanSDK-1.3.296.0-Installer.exe"
        Invoke-WebRequest -Uri $url -OutFile "VulkanSDK.exe" -UserAgent "curl/7.88.1"
        Start-Process -FilePath .\VulkanSDK.exe -ArgumentList "--root C:\VulkanSDK --accept-licenses --default-answer --confirm-command install" -Wait
        
        if (Test-Path "C:\VulkanSDK\Bin") { $sdkRoot = "C:\VulkanSDK" } 
        else { $sdkRoot = Get-ChildItem "C:\VulkanSDK" | Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName }
        
        echo "VULKAN_SDK=$sdkRoot" >> $env:GITHUB_ENV
        echo "VK_SDK_PATH=$sdkRoot" >> $env:GITHUB_ENV
        echo "$sdkRoot\Bin" >> $env:GITHUB_PATH
        Remove-Item VulkanSDK.exe

    - name: Prepare Libmpv
      shell: pwsh
      run: |
        $url = "https://downloads.sourceforge.net/project/mpv-player-windows/libmpv/mpv-dev-x86_64-v3-20251214-git-f7be2ee.7z"
        Invoke-WebRequest -Uri $url -OutFile "mpv.7z" -UserAgent "curl/7.88.1" -MaximumRedirection 5
        7z x mpv.7z -ompv
        Set-Location mpv
        
        cmd.exe /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" && dumpbin /exports libmpv-2.dll > exports.txt"
        $defContent = @("LIBRARY libmpv-2.dll", "EXPORTS") + (Get-Content exports.txt | ForEach-Object { if ($_ -match "^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)") { $matches[1] } })
        $defContent | Set-Content libmpv-2.def
        cmd.exe /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" && lib /def:libmpv-2.def /out:libmpv.lib /MACHINE:X64"
        
        Copy-Item -Recurse -Force include\* ..\dep-install\include\
        Copy-Item libmpv.lib ..\dep-install\lib\
        Copy-Item libmpv-2.dll ..\dep-install\bin\

    - name: Prepare SDL2
      shell: pwsh
      run: |
        $url = "https://github.com/libsdl-org/SDL/releases/download/release-2.30.0/SDL2-devel-2.30.0-VC.zip"
        Invoke-WebRequest -Uri $url -OutFile "sdl2.zip"
        Expand-Archive -Path "sdl2.zip" -DestinationPath "sdl2-temp" -Force
        $root = (Get-ChildItem "sdl2-temp" | Select-Object -First 1).FullName
        
        Copy-Item -Recurse -Force "$root\include\*" "dep-install\include\"
        Copy-Item -Force "$root\lib\x64\SDL2.lib" "dep-install\lib\"
        Copy-Item -Force "$root\lib\x64\SDL2main.lib" "dep-install\lib\"
        Copy-Item -Force "$root\lib\x64\SDL2.dll" "dep-install\bin\"
        Remove-Item -Recurse -Force "sdl2-temp", "sdl2.zip"

    - name: Prepare ECM and MpvQt
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        set "INSTALL_DIR=%GITHUB_WORKSPACE%\dep-install"
        set "INSTALL_DIR_FWD=%GITHUB_WORKSPACE:\=/%/dep-install"
        set "INCLUDE_DIR_FWD=%GITHUB_WORKSPACE:\=/%/dep-install/include"
        
        git clone https://github.com/KDE/extra-cmake-modules.git
        cd extra-cmake-modules
        cmake -B build -GNinja -DCMAKE_INSTALL_PREFIX="%INSTALL_DIR%"
        ninja -C build install
        cd ..
        
        git clone --branch v1.0.0 https://github.com/KDE/mpvqt.git
        cd mpvqt
        
        powershell -Command "$c = Get-Content src/mpvcontroller.h -Raw; $c = $c -replace '\s*virtual\s+~MpvController\(\).*?;', '' -replace '\s*~MpvController\(\).*?;', ''; $nl = [Environment]::NewLine; $c = $c.Replace('explicit MpvController(QObject *parent = nullptr);', 'explicit MpvController(QObject *parent = nullptr);' + $nl + '    virtual ~MpvController();'); Set-Content src/mpvcontroller.h $c"
        echo. >> src\mpvcontroller.cpp
        echo MpvController::~MpvController() = default; >> src\mpvcontroller.cpp
        
        cmake -B build -GNinja -DCMAKE_INSTALL_PREFIX="%INSTALL_DIR%" -DCMAKE_PREFIX_PATH="%INSTALL_DIR_FWD%;%Qt6_DIR%" -DECM_DIR="%INSTALL_DIR_FWD%/share/ECM/cmake" -DCMAKE_CXX_FLAGS="-I\"%INCLUDE_DIR_FWD%\""
        ninja -C build install
        cd ..

    - name: Download & Stage VC++ Redist and OpenSSL
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path bundle/win
        Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "bundle/win/vcredist_x64.exe" -UserAgent "curl/7.88.1"
        
        $sslUrl = "https://download.firedaemon.com/FireDaemon-OpenSSL/openssl-3.6.0.zip"
        Invoke-WebRequest -Uri $sslUrl -OutFile "openssl.zip" -UserAgent "Mozilla/5.0"
        Expand-Archive -Path "openssl.zip" -DestinationPath "openssl-temp" -Force
        $binPath = (Get-ChildItem -Path "openssl-temp" -Recurse -Filter "libssl-3-x64.dll" | Select-Object -First 1).DirectoryName
        Copy-Item "$binPath\libssl-3-x64.dll" "dep-install\bin\"
        Copy-Item "$binPath\libcrypto-3-x64.dll" "dep-install\bin\"
        Remove-Item -Recurse -Force "openssl-temp", "openssl.zip"

    - name: Patch WiX Bundle.wxs
      shell: pwsh
      run: |
        $bundle  = "bundle/win/Bundle.wxs"
        if (Test-Path $bundle) {
            $c = Get-Content -Raw $bundle -Encoding UTF8
            $c = $c -replace 'Source=".*vcredist_x64.exe"', 'Source="bundle\win\vcredist_x64.exe"'
            $c = [regex]::Replace($c, 'C:\\Program Files \(x86\)\\Microsoft Visual Studio\\(2019|2022)\\BuildTools\\VC\\Redist\\MSVC\\[^"\\]+\\vcredist_x64\.exe', 'vcredist_x64.exe')
            Set-Content -LiteralPath $bundle -Value $c -Encoding UTF8
        }

    - name: Configure and Build Jellyfin Desktop
      shell: pwsh
      run: |
        $root = (Get-Location).Path.Replace("\", "/")
        $dep = "$root/dep-install"
        $libMpv = "$dep/lib/libmpv.lib"
        $incMpv = "$dep/include"
        $mpvQtDir = "$dep/lib/cmake/MpvQt"
        $installPrefix = "$root/output"

        # Override FindMPV
        $cmakeMod = "CMakeModules/FindMPV.cmake"
        @"
        set(MPV_FOUND TRUE)
        set(MPV_INCLUDE_DIR "$incMpv")
        set(MPV_LIBRARY "$libMpv")
        set(MPV_LIBRARIES "$libMpv")
        set(MPV_INCLUDE_DIRS "$incMpv")
        if(NOT TARGET MPV::MPV)
          add_library(MPV::MPV UNKNOWN IMPORTED)
          set_target_properties(MPV::MPV PROPERTIES IMPORTED_LOCATION "$libMpv" INTERFACE_INCLUDE_DIRECTORIES "$incMpv")
        endif()
        "@ | Set-Content $cmakeMod

        # Patch Codecs
        $f='src/player/CodecsComponent.cpp'
        Set-Content $f ("#include <windows.h>`n" + (Get-Content $f -Raw))

        # Build
        cmd.exe /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" && cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=`"$installPrefix`" -DCMAKE_PREFIX_PATH=`"$dep;$env:Qt6_DIR`" -DMpvQt_DIR=`"$mpvQtDir`" ."
        cmd.exe /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" && ninja -C build"

    - name: Install and Fix Deployment
      shell: pwsh
      run: |
        # 1. RUN INSTALL (Populate output directory)
        cmd.exe /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" && ninja -C build install"
        
        $outDir = "$((Get-Location).Path)/output"
        $depBin = "dep-install/bin"
        if (-not (Test-Path $outDir)) { throw "Output dir missing!" }

        # 2. WINDEPLOYQT
        $qmlDir = "dep-install/lib/qml"
        if (-not (Test-Path $qmlDir)) { $qmlDir = "dep-install/qml" }
        Write-Host "Running windeployqt with QML: $qmlDir"
        
        # Use --verbose 2 to see why it skips things
        & "windeployqt" --verbose 2 --release --force --qmldir src/ui --qmlimport "$qmlDir" --compiler-runtime --no-opengl-sw --xml "$outDir/Jellyfin Desktop.exe"

        # 3. FIX VCRUNTIME (Recursive)
        $vcRoot = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC"
        $dllSrc = Get-ChildItem -Path $vcRoot -Recurse -Filter "vcruntime140.dll" | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
        $redistDir = $dllSrc.DirectoryName
        Write-Host "Copying VCRedist from: $redistDir"
        copy "$redistDir/*.dll" $outDir -Force

        # 4. COPY DEPS
        $deps = @("libssl-3-x64.dll", "libcrypto-3-x64.dll", "libmpv-2.dll", "SDL2.dll", "MpvQt.dll")
        foreach ($d in $deps) {
            if (Test-Path "$depBin/$d") { copy "$depBin/$d" $outDir -Force }
            else { Write-Error "Missing $d" }
        }

        # 5. SAFETY COPY QT DLLS
        $qtBin = "$env:Qt6_DIR/bin"
        $qtDlls = @("Qt6Core.dll", "Qt6Gui.dll", "Qt6Quick.dll", "Qt6Widgets.dll", "Qt6Network.dll", "Qt6OpenGL.dll", "Qt6Qml.dll", "Qt6QmlModels.dll", "Qt6QmlWorkerScript.dll", "Qt6Svg.dll")
        foreach ($q in $qtDlls) {
            if (-not (Test-Path "$outDir/$q")) {
                Write-Warning "Force copying $q"
                copy "$qtBin/$q" $outDir -Force
            }
        }

        # 6. VERIFY
        if (Test-Path "$outDir/Qt6Quick.dll") { Write-Host "VERIFIED: Qt6Quick.dll is present." }
        else { Write-Error "FATAL: Qt6Quick.dll is MISSING from output!" }

    - name: Create Portable Zip
      shell: pwsh
      run: Compress-Archive -Path output\* -DestinationPath Jellyfin-Desktop-Portable.zip

    - name: Upload Portable Zip
      uses: actions/upload-artifact@v4
      with:
        name: jellyfin-desktop-portable
        path: Jellyfin-Desktop-Portable.zip

    - name: Build Installer (WiX)
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        set PATH=%PATH%;C:\Program Files (x86)\WiX Toolset v3.11\bin
        cd build
        ninja windows_package

    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: jellyfin-desktop-installer
        path: build/JellyfinDesktop-*.exe
