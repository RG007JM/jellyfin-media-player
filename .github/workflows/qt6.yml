name: Build Qt6 Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - qt6

jobs:
  build-win64:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Qt 6.8.0
      uses: jurplel/install-qt-action@v4
      with:
        version: "6.8.0"
        arch: "win64_msvc2022_64"
        modules: "qtwebengine qtwebchannel qtmultimedia qtpositioning"

    - name: Setup Build Environment (Ninja, Dirs)
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        mkdir build
        mkdir dep-install
        mkdir dep-install\include
        mkdir dep-install\lib
        mkdir dep-install\bin
        
        rem Download Ninja
        curl -L https://github.com/ninja-build/ninja/releases/download/v1.10.2/ninja-win.zip -o ninja.zip
        tar -xf ninja.zip -C dep-install\bin
        del ninja.zip
        
        rem Add dep-install\bin to PATH
        echo %GITHUB_WORKSPACE%\dep-install\bin>> %GITHUB_PATH%

    - name: Prepare Libmpv
      shell: pwsh
      run: |
        $url = "https://downloads.sourceforge.net/project/mpv-player-windows/libmpv/mpv-dev-x86_64-v3-20251214-git-f7be2ee.7z"
        Invoke-WebRequest -Uri $url -OutFile "mpv.7z" -UserAgent "curl/7.88.1" -MaximumRedirection 5
        
        if ((Get-Item "mpv.7z").Length -lt 1000000) { throw "Download failed" }
        
        7z x mpv.7z -ompv
        Set-Location mpv
        
        # Create .lib from .dll
        cmd.exe /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" && dumpbin /exports libmpv-2.dll > exports.txt"
        $defContent = @("LIBRARY libmpv-2.dll", "EXPORTS")
        $lines = Get-Content exports.txt
        foreach ($line in $lines) {
            if ($line -match "^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)") {
                $defContent += $matches[1]
            }
        }
        $defContent | Set-Content libmpv-2.def
        cmd.exe /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" && lib /def:libmpv-2.def /out:libmpv.lib /MACHINE:X64"
        
        # Correctly stage headers and libs
        Copy-Item -Recurse -Force include\* ..\dep-install\include\
        Copy-Item libmpv.lib ..\dep-install\lib\
        Copy-Item libmpv-2.dll ..\dep-install\bin\

    - name: Prepare ECM and MpvQt
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        set "INSTALL_DIR=%GITHUB_WORKSPACE%\dep-install"
        set "INSTALL_DIR_FWD=%GITHUB_WORKSPACE:\=/%/dep-install"
        
        rem --- Build ECM ---
        git clone https://github.com/KDE/extra-cmake-modules.git
        cd extra-cmake-modules
        cmake -B build -GNinja -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_INSTALL_PREFIX="%INSTALL_DIR%"
        if %errorlevel% neq 0 exit /b %errorlevel%
        
        ninja -C build install
        if %errorlevel% neq 0 exit /b %errorlevel%
        cd ..
        
        rem --- Build MpvQt (v1.0.0) ---
        git clone --branch v1.0.0 https://github.com/KDE/mpvqt.git
        cd mpvqt
        
        rem PATCH: Fix MSVC C2027 (incomplete type deletion)
        rem 1. Remove ANY existing destructor line
        powershell -Command "(Get-Content src/mpvcontroller.h) -replace '\s*virtual\s+~MpvController\(\).*?;', '' -replace '\s*~MpvController\(\).*?;', '' | Set-Content src/mpvcontroller.h"
        
        rem 2. Insert clean destructor declaration (SAFE METHOD using explicit string concatenation)
        powershell -Command "$c = Get-Content src/mpvcontroller.h -Raw; $nl = [Environment]::NewLine; $c = $c.Replace('explicit MpvController(QObject *parent = nullptr);', 'explicit MpvController(QObject *parent = nullptr);' + $nl + '    virtual ~MpvController();'); Set-Content src/mpvcontroller.h $c"
        
        rem 3. Append definition to source file
        echo. >> src\mpvcontroller.cpp
        echo MpvController::~MpvController() = default; >> src\mpvcontroller.cpp
        
        cmake -B build -GNinja ^
          -DCMAKE_C_COMPILER=cl ^
          -DCMAKE_CXX_COMPILER=cl ^
          -DCMAKE_INSTALL_PREFIX="%INSTALL_DIR%" ^
          -DCMAKE_PREFIX_PATH="%INSTALL_DIR_FWD%;%Qt6_DIR%" ^
          -DECM_DIR="%INSTALL_DIR_FWD%/share/ECM/cmake" ^
          -DCMAKE_CXX_FLAGS="-I%INSTALL_DIR_FWD%/include -EHsc"
        if %errorlevel% neq 0 exit /b %errorlevel%
        
        ninja -C build install
        if %errorlevel% neq 0 exit /b %errorlevel%
        cd ..

    - name: Download & Stage VC++ Redist and OpenSSL 3
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path bundle/win
        
        # VC++ Redist
        $vcUrl = "https://aka.ms/vs/17/release/vc_redist.x64.exe"
        Write-Host "Downloading VC++ Redist..."
        Invoke-WebRequest -Uri $vcUrl -OutFile "vc_redist.x64.exe" -UserAgent "curl/7.88.1"
        Copy-Item "vc_redist.x64.exe" "bundle/win/vcredist_x64.exe"
        
        # OpenSSL 3.6.0
        $sslUrl = "https://download.firedaemon.com/FireDaemon-OpenSSL/openssl-3.6.0.zip"
        $zipPath = "openssl.zip"
        Write-Host "Downloading OpenSSL..."
        Invoke-WebRequest -Uri $sslUrl -OutFile $zipPath -UserAgent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
        if ((Get-Item $zipPath).Length -lt 1000000) { throw "Download failed" }
        Expand-Archive -Path $zipPath -DestinationPath "openssl-temp" -Force
        
        $binPath = Get-ChildItem -Path "openssl-temp" -Recurse -Filter "libssl-3-x64.dll" | Select-Object -First 1 | Split-Path -Parent
        if (-not $binPath) { throw "Could not find OpenSSL DLLs" }
        Copy-Item "$binPath\libssl-3-x64.dll" "dep-install\bin\"
        Copy-Item "$binPath\libcrypto-3-x64.dll" "dep-install\bin\"
        Remove-Item -Recurse -Force "openssl-temp"
        Remove-Item -Force $zipPath

    - name: Patch WiX Bundle.wxs
      shell: pwsh
      run: |
        $bundle  = "bundle/win/Bundle.wxs"
        if (Test-Path $bundle) {
            $content = Get-Content -Raw $bundle -Encoding UTF8
            $pattern = 'Source=".*vcredist_x64.exe"'
            $patched = $content -replace $pattern, 'Source="bundle\win\vcredist_x64.exe"'
            $pattern2 = 'C:\\Program Files \(x86\)\\Microsoft Visual Studio\\(2019|2022)\\BuildTools\\VC\\Redist\\MSVC\\[^"\\]+\\vcredist_x64\.exe'
            $patched = [regex]::Replace($patched, $pattern2, 'vcredist_x64.exe')
            Set-Content -LiteralPath $bundle -Value $patched -Encoding UTF8
        }

    - name: Build Jellyfin Desktop
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        set PATH=%PATH%;C:\Program Files (x86)\WiX Toolset v3.11\bin
        cd build
        
        rem Define Absolute Paths
        set "DEP_INSTALL=%GITHUB_WORKSPACE%\dep-install"
        set "DEP_INSTALL_FWD=%GITHUB_WORKSPACE:\=/%/dep-install"
        
        rem Locate MpvQtConfig.cmake
        for /f "delims=" %%i in ('dir /s /b "%DEP_INSTALL%\MpvQtConfig.cmake"') do set MPVQT_CONFIG_PATH=%%~dpi
        if defined MPVQT_CONFIG_PATH set MPVQT_DIR=%MPVQT_CONFIG_PATH%
        
        rem Locate ECMConfig.cmake
        for /f "delims=" %%i in ('dir /s /b "%DEP_INSTALL%\ECMConfig.cmake"') do set ECM_CONFIG_PATH=%%~dpi
        if defined ECM_CONFIG_PATH set ECM_DIR=%ECM_CONFIG_PATH%
        
        echo Found MpvQt DIR: %MPVQT_DIR%
        echo Found ECM DIR: %ECM_DIR%
        
        cmake -GNinja ^
          -DCMAKE_C_COMPILER=cl ^
          -DCMAKE_CXX_COMPILER=cl ^
          -DCMAKE_BUILD_TYPE=RelWithDebInfo ^
          -DCMAKE_INSTALL_PREFIX=output ^
          -DCMAKE_PREFIX_PATH="%DEP_INSTALL_FWD%;%Qt6_DIR%" ^
          -DMpvQt_DIR="%MPVQT_DIR%" ^
          -DECM_DIR="%ECM_DIR%" ^
          -DQTROOT="%Qt6_DIR%" ^
          ..
        
        ninja
        ninja install
        
        echo Deploying Qt...
        %Qt6_DIR%\bin\windeployqt.exe --release --qmldir ..\src\ui output\JellyfinMediaPlayer.exe
        
        copy "%DEP_INSTALL%\bin\libssl-3-x64.dll" output\
        copy "%DEP_INSTALL%\bin\libcrypto-3-x64.dll" output\
        copy "%DEP_INSTALL%\bin\libmpv-2.dll" output\
        
        ninja windows_package

    - name: Archive installer
      uses: actions/upload-artifact@v4
      with:
        name: jellyfin-desktop-windows
        path: ${{ github.workspace }}/build/JellyfinMediaPlayer-*.exe
