name: build
on: workflow_dispatch

jobs:
  build-win64:
    runs-on: windows-latest

    # 1. Force OpenGL backend for QQuickFramebufferObject support
    env:
      QSG_RHI_BACKEND: opengl
      QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox

    steps:
    - uses: actions/checkout@v4

    - name: Install Qt 6.8.0
      uses: jurplel/install-qt-action@v4
      with:
        version: "6.8.0"
        arch: "win64_msvc2022_64"
        modules: "qtwebengine qtwebchannel qtmultimedia qtpositioning qtshadertools qt5compat qtimageformats qtserialport"

    - name: Install dependencies (mpv, ninja, stage VC++ redist)
      shell: bash
      run: |
        set -e
        mkdir -p build
        # VC++ Redistributable
        curl -L https://aka.ms/vs/17/release/vc_redist.x64.exe -o vc_redist.x64.exe
        mkdir -p bundle/win
        cp vc_redist.x64.exe bundle/win/vcredist_x64.exe
        
        # Ninja
        curl -L https://github.com/ninja-build/ninja/releases/download/v1.10.2/ninja-win.zip -o ninja.zip
        unzip -o ninja.zip
        mv -f ninja.exe build/
        
        # MPV (Guaranteed working version 2025-11-16)
        curl -L "https://sourceforge.net/projects/mpv-player-windows/files/libmpv/mpv-dev-x86_64-v3-20251116-git-701201b.7z/download" -o mpv.7z
        7z x mpv.7z
        mkdir -p mpv
        mv include mpv
        # Generate lib/def for MSVC linkage
        gendef libmpv-2.dll
        mv libmpv-2.dll mpv/libmpv-2.dll
        mv libmpv-2.def mpv.def
        mv mpv.def libmpv.dll.a mpv/
        mv mpv build/

    - name: Patch WiX Bundle.wxs redist path
      shell: pwsh
      run: |
        $bundle  = "bundle/win/Bundle.wxs"
        $content = Get-Content -Raw $bundle -Encoding UTF8
        $pattern = 'C:\\Program Files \(x86\)\\Microsoft Visual Studio\\(2019|2022)\\BuildTools\\VC\\Redist\\MSVC\\[^"\\]+\\vcredist_x64\.exe'
        $patched = [regex]::Replace($content, $pattern, 'vcredist_x64.exe')
        Set-Content -LiteralPath $bundle -Value $patched -Encoding UTF8
        if (-not (Select-String -Path $bundle -SimpleMatch -Pattern "vcredist_x64.exe")) {
          throw "Bundle patch failed: vcredist_x64.exe not found in Bundle.wxs"
        }

    # 2. RESTORED: Install extra-cmake-modules and MpvQt
    # These were missing in the previous attempt but are required for the build.
    - name: Build MpvQt
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        set "INSTALL_DIR=%GITHUB_WORKSPACE%\dep-install"
        set "INSTALL_DIR_FWD=%GITHUB_WORKSPACE:\=/%/dep-install"
        set "INCLUDE_DIR_FWD=%GITHUB_WORKSPACE:\=/%/dep-install/include"
        
        if not exist dep-install\bin mkdir dep-install\bin
        if not exist dep-install\include mkdir dep-install\include
        if not exist dep-install\lib mkdir dep-install\lib
        
        rem Build extra-cmake-modules
        git clone https://github.com/KDE/extra-cmake-modules.git
        cd extra-cmake-modules
        cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="%INSTALL_DIR%"
        ninja -C build install
        cd ..
        
        rem Build MpvQt
        git clone --branch v1.0.0 https://github.com/KDE/mpvqt.git
        cd mpvqt
        
        rem Patch mpvcontroller.h for Windows compatibility (adding virtual destructor)
        powershell -Command "$c = Get-Content src/mpvcontroller.h -Raw; $c = $c -replace '\s*virtual\s+~MpvController\(\).*?;', '' -replace '\s*~MpvController\(\).*?;', ''; $nl = [Environment]::NewLine; $c = $c.Replace('explicit MpvController(QObject *parent = nullptr);', 'explicit MpvController(QObject *parent = nullptr);' + $nl + '    virtual ~MpvController();'); Set-Content src/mpvcontroller.h $c"
        echo. >> src\mpvcontroller.cpp
        echo MpvController::~MpvController() = default; >> src\mpvcontroller.cpp
        
        rem Configure and Install MpvQt
        cmake -B build -GNinja ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DCMAKE_INSTALL_PREFIX="%INSTALL_DIR%" ^
          -DCMAKE_PREFIX_PATH="%INSTALL_DIR_FWD%;%Qt6_DIR%" ^
          -DECM_DIR="%INSTALL_DIR_FWD%/share/ECM/cmake" ^
          -DCMAKE_CXX_FLAGS="-I\"%INCLUDE_DIR_FWD%\""
        ninja -C build install
        cd ..

    - name: Build
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        cd build
        
        rem Setup WiX
        set WIXBIN=C:\Program Files (x86)\WiX Toolset v3.14\bin
        if not exist "%WIXBIN%\light.exe" set WIXBIN=C:\Program Files (x86)\WiX Toolset v3.11\bin
        set PATH=%PATH%;%WIXBIN%;%CD%
        
        rem Configure Main Project
        rem Added CMAKE_PREFIX_PATH so it finds MpvQt and extra-cmake-modules
        cmake -GNinja ^
          -DCMAKE_BUILD_TYPE=RelWithDebInfo ^
          -DCMAKE_INSTALL_PREFIX=output ^
          -DCMAKE_MAKE_PROGRAM=ninja.exe ^
          -DCMAKE_PREFIX_PATH="%GITHUB_WORKSPACE:\=/%/dep-install;%Qt6_DIR%" ^
          -DQTROOT=%Qt6_DIR% ^
          -DMPV_INCLUDE_DIR=mpv/include ^
          -DMPV_LIBRARY=mpv/libmpv-2.dll ^
          ..
        
        rem Link MPV
        lib /def:mpv\mpv.def /out:mpv\libmpv-2.dll.lib /MACHINE:X64
        
        rem Build and Install
        ninja
        ninja install
        
        rem Deploy Qt Dependencies
        for %%I in ("%Qt6_DIR%\..\..") do set QTBIN=%%~fI\bin
        %QTBIN%\windeployqt.exe --release --qmldir ..\src\ui output\JellyfinMediaPlayer.exe
        
        rem 3. DO NOT REMOVE opengl32sw.dll
        
        rem Package MSI/EXE
        ninja windows_package

    - name: Archive installer
      uses: actions/upload-artifact@v4
      with:
        name: windows
        path: ${{ github.workspace }}/build/JellyfinMediaPlayer-*.exe
