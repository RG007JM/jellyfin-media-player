name: build

on:
  workflow_dispatch:

jobs:
  build-win64:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Qt 5.15.2
      uses: jurplel/install-qt-action@v4
      with:
        version: "5.15.2"
        arch: "win64_msvc2019_64"
        modules: "qtwebengine"

    - name: Install dependencies (mpv, ninja, stage redist)
      shell: bash
      run: |
        set -e
        mkdir -p build

        # VC++ redist: download and stage alongside Bundle.wxs
        curl -L https://aka.ms/vs/17/release/vc_redist.x64.exe -o vc_redist.x64.exe
        mkdir -p bundle/win
        cp vc_redist.x64.exe bundle/win/vcredist_x64.exe

        # Ninja
        curl -L https://github.com/ninja-build/ninja/releases/download/v1.10.2/ninja-win.zip -o ninja.zip
        unzip -o ninja.zip
        mv -f ninja.exe build/

        # mpv dev (x86_64-v3, 2025-11-16)
        curl -L "https://sourceforge.net/projects/mpv-player-windows/files/libmpv/mpv-dev-x86_64-v3-20251116-git-701201b.7z/download" -o mpv.7z
        7z x mpv.7z
        mkdir -p mpv
        mv include mpv
        gendef libmpv-2.dll
        mv libmpv-2.dll mpv/libmpv-2.dll
        mv libmpv-2.def mpv.def
        mv mpv.def libmpv.dll.a mpv/
        mv mpv build/

    - name: Patch WiX Bundle.wxs redist path (PowerShell)
      shell: pwsh
      run: |
        $bundle = "bundle/win/Bundle.wxs"
        $content = Get-Content -Raw $bundle
        # Replace any VS 2019/2022 MSVC redist absolute path with local file name
        $regex = 'C:\\Program Files \(x86\)\\Microsoft Visual Studio\\(2019|2022)\\BuildTools\\VC\\Redist\\MSVC\\[^"\\]+\\vcredist_x64\.exe'
        $new = $content -replace $regex, 'vcredist_x64.exe'
        Set-Content -LiteralPath $bundle -Value $new -Encoding UTF8
        # Show confirmation
        Select-String -Path $bundle -Pattern 'vcredist_x64
