name: build

on:
  workflow_dispatch:

jobs:
  build-win64:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Qt 5.15.2
      uses: jurplel/install-qt-action@v4
      with:
        version: "5.15.2"
        arch: "win64_msvc2019_64"
        modules: "qtwebengine"

    - name: Install dependencies
      run: |
        mkdir build
        curl -L https://aka.ms/vs/17/release/vc_redist.x64.exe > vc_redist.x64.exe
        sed -i 's#C:\\Program Files (x86)\\Microsoft Visual Studio\\2019\\BuildTools\\VC\\Redist\\MSVC\\v142\\vcredist_x64.exe#'"$(readlink -f vc_redist.x64.exe | sed 's#/\([a-z]\)/#\1:\\#g' | tr '/' '\\' | sed 's/\\/\\\\/g')#g" bundle/win/Bundle.wxs
        curl -L https://github.com/ninja-build/ninja/releases/download/v1.10.2/ninja-win.zip > ninja.zip
        unzip ninja.zip
        mv ninja.exe build/
        curl -L https://sourceforge.net/projects/mpv-player-windows/files/libmpv/mpv-dev-x86_64-v3-20251116-git-701201b.7z/download > mpv.7z
        7z x mpv.7z
        mkdir mpv
        mv include mpv
        gendef libmpv-2.dll
        mv libmpv-2.dll mpv/libmpv-2.dll
        mv libmpv-2.def mpv.def
        mv mpv.def libmpv.dll.a mpv/
        mv mpv build/
      shell: bash

    - name: Build
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        cd build
        set PATH=%PATH%;C:\Program Files (x86)\WiX Toolset v3.11\bin;%CD%
        cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX=output -DCMAKE_MAKE_PROGRAM=ninja.exe -DQTROOT=%Qt5_DIR% -DMPV_INCLUDE_DIR=mpv/include -DMPV_LIBRARY=mpv/libmpv-2.dll -DCMAKE_INSTALL_PREFIX=output ..
        lib /def:mpv\mpv.def /out:mpv\libmpv-2.dll.lib /MACHINE:X64
        ninja
        ninja install

        rem Find Qt bin properly from Qt5_DIR (which points to lib\cmake)
        for %%I in ("%Qt5_DIR%\..\..") do set QTBIN=%%~fI\bin

        rem Deploy Qt runtime + QML modules used by Jellyfin
        %QTBIN%\windeployqt.exe --release --qmldir ..\src\ui output\JellyfinMediaPlayer.exe

        rem Create Safe Mode launcher that forces software rendering and disables GPU compositing
        echo @echo off> output\JellyfinMediaPlayer-SafeMode.cmd
        echo set "QTWEBENGINE_CHROMIUM_FLAGS=--disable-gpu --disable-gpu-compositing --ignore-gpu-blocklist --disable-features=UseSkiaRenderer">> output\JellyfinMediaPlayer-SafeMode.cmd
        echo set "QT_OPENGL=software">> output\JellyfinMediaPlayer-SafeMode.cmd
        echo set "QSG_RENDER_LOOP=basic">> output\JellyfinMediaPlayer-SafeMode.cmd
        echo set "QT_ANGLE_PLATFORM=warp">> output\JellyfinMediaPlayer-SafeMode.cmd
        echo start "" "JellyfinMediaPlayer.exe">> output\JellyfinMediaPlayer-SafeMode.cmd

        rem Package the installer
        ninja windows_package
      shell: cmd

    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows
        path: ${{ github.workspace }}/build/JellyfinMediaPlayer-*.exe
