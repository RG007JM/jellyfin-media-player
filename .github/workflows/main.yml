name: build

on:
  workflow_dispatch:

jobs:
  build-win64:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Qt 5.15.2
      uses: jurplel/install-qt-action@v4
      with:
        version: "5.15.2"
        arch: "win64_msvc2019_64"
        modules: "qtwebengine"

    - name: Install dependencies (mpv, ninja, stage VC++ redist)
      shell: bash
      run: |
        set -e
        mkdir -p build

        # VC++ Redistributable: stage beside Bundle.wxs so WiX light -b resolves it
        curl -L https://aka.ms/vs/17/release/vc_redist.x64.exe -o vc_redist.x64.exe
        mkdir -p bundle/win
        cp vc_redist.x64.exe bundle/win/vcredist_x64.exe

        # Ninja
        curl -L https://github.com/ninja-build/ninja/releases/download/v1.10.2/ninja-win.zip -o ninja.zip
        unzip -o ninja.zip
        mv -f ninja.exe build/

        # mpv dev (x86_64-v3, 2025-11-16)
        curl -L "https://sourceforge.net/projects/mpv-player-windows/files/libmpv/mpv-dev-x86_64-v3-20251116-git-701201b.7z/download" -o mpv.7z
        7z x mpv.7z
        mkdir -p mpv
        mv include mpv
        gendef libmpv-2.dll
        mv libmpv-2.dll mpv/libmpv-2.dll
        mv libmpv-2.def mpv.def
        mv mpv.def libmpv.dll.a mpv/
        mv mpv build/

    - name: Patch WiX Bundle.wxs redist path
      shell: pwsh
      run: |
        $bundle  = "bundle/win/Bundle.wxs"
        $content = Get-Content -Raw $bundle -Encoding UTF8
        $pattern = 'C:\\Program Files \(x86\)\\Microsoft Visual Studio\\(2019|2022)\\BuildTools\\VC\\Redist\\MSVC\\[^"\\]+\\vcredist_x64\.exe'
        $patched = [regex]::Replace($content, $pattern, 'vcredist_x64.exe')
        Set-Content -LiteralPath $bundle -Value $patched -Encoding UTF8
        if (-not (Select-String -Path $bundle -SimpleMatch -Pattern "vcredist_x64.exe")) {
          throw "Bundle patch failed: vcredist_x64.exe not found in Bundle.wxs"
        }

   # Fast & reliable OpenSSL 1.1.1w provisioning with cache + mirrored fallbacks
    - name: Cache OpenSSL 1.1.1w DLLs
      uses: actions/cache@v4
      with:
        path: build/openssl-cache
        key: openssl-1.1.1w-x64-dlls
    
    - name: Provide OpenSSL 1.1 DLLs
      shell: pwsh
      run: |
        $cache = "$env:GITHUB_WORKSPACE\build\openssl-cache"
        $out   = "$env:GITHUB_WORKSPACE\build\output"
        New-Item -ItemType Directory -Force -Path $cache,$out | Out-Null
    
        $ssl = Join-Path $cache "libssl-1_1-x64.dll"
        $cry = Join-Path $cache "libcrypto-1_1-x64.dll"
        if (Test-Path $ssl -and Test-Path $cry) {
          Copy-Item $ssl $out -Force
          Copy-Item $cry $out -Force
          exit 0
        }
    
        # Parallel mirrored downloads of the installer; first success wins
        $vers = @("w","v","u")
        $jobs = @()
        foreach ($v in $vers) {
          $url = "https://slproweb.com/download/Win64OpenSSL-1_1_1$($v).exe"
          $dst = "$env:RUNNER_TEMP\Win64OpenSSL-1_1_1$($v).exe"
          $jobs += Start-Job -ScriptBlock {
            param($u,$d)
            try {
              Invoke-WebRequest -Uri $u -OutFile $d -UseBasicParsing -TimeoutSec 300 -MaximumRedirection 5
              if (Test-Path $d) { return $d } else { return $null }
            } catch { return $null }
          } -ArgumentList $url,$dst
        }
    
        $done = Wait-Job -Job $jobs -Any -Timeout 360
        if (-not $done) { throw "Timed out downloading OpenSSL installer from mirrors" }
        $path = Receive-Job $done | Select-Object -Last 1
        $jobs | Remove-Job -Force
    
        if (-not $path -or -not (Test-Path $path)) { throw "Failed to download any OpenSSL 1.1.1 installer" }
    
        # Extract DLLs from installer with 7z (already on runner)
        $dir = "$env:RUNNER_TEMP\openssl111"
        if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
        New-Item -ItemType Directory -Force -Path $dir | Out-Null
        & 7z x -y -o"$dir" "$path" | Out-Null
    
        $sslFound = Get-ChildItem -Path $dir -Recurse -Filter "libssl-1_1-x64.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
        $cryFound = Get-ChildItem -Path $dir -Recurse -Filter "libcrypto-1_1-x64.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $sslFound -or -not $cryFound) { throw "Could not locate OpenSSL 1.1 DLLs inside installer" }
    
        Copy-Item $sslFound.FullName $cache -Force
        Copy-Item $cryFound.FullName $cache -Force
        Copy-Item $sslFound.FullName $out   -Force
        Copy-Item $cryFound.FullName $out   -Force
    
        # Sanity check
        if (-not (Test-Path "$out\libssl-1_1-x64.dll"))    { throw "Missing libssl-1_1-x64.dll" }
        if (-not (Test-Path "$out\libcrypto-1_1-x64.dll")) { throw "Missing libcrypto-1_1-x64.dll" }

    - name: Build
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        cd build

        rem Prefer WiX 3.14, fallback to 3.11
        set WIXBIN=C:\Program Files (x86)\WiX Toolset v3.14\bin
        if not exist "%WIXBIN%\light.exe" set WIXBIN=C:\Program Files (x86)\WiX Toolset v3.11\bin
        set PATH=%PATH%;%WIXBIN%;%CD%

        cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX=output -DCMAKE_MAKE_PROGRAM=ninja.exe -DQTROOT=%Qt5_DIR% -DMPV_INCLUDE_DIR=mpv/include -DMPV_LIBRARY=mpv/libmpv-2.dll -DCMAKE_INSTALL_PREFIX=output ..
        lib /def:mpv\mpv.def /out:mpv\libmpv-2.dll.lib /MACHINE:X64
        ninja
        ninja install

        for %%I in ("%Qt5_DIR%\..\..") do set QTBIN=%%~fI\bin
        %QTBIN%\windeployqt.exe --release --qmldir ..\src\ui output\JellyfinMediaPlayer.exe

        rem Package MSI/EXE; light -b picks vcredist_x64.exe from bundle/win
        ninja windows_package

    - name: Archive installer
      uses: actions/upload-artifact@v4
      with:
        name: windows
        path: ${{ github.workspace }}/build/JellyfinMediaPlayer-*.exe
