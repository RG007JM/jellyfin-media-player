name: build

on:
  workflow_dispatch:

jobs:
  build-win64:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Qt 5.15.2
      uses: jurplel/install-qt-action@v4
      with:
        version: "5.15.2"
        arch: "win64_msvc2019_64"
        modules: "qtwebengine"

    - name: Install dependencies
      shell: bash
      run: |
        set -e
        mkdir -p build

        # VC++ Redistributable: download and stage inside bundle/win
        curl -L https://aka.ms/vs/17/release/vc_redist.x64.exe -o vc_redist.x64.exe
        mkdir -p bundle/win
        cp vc_redist.x64.exe bundle/win/vcredist_x64.exe

        # Rewrite any hardcoded VS path in Bundle.wxs to the local file
        sed -i -E 's#C:\\\\Program Files \\(x86\\)\\\\Microsoft Visual Studio\\\\(2019|2022)\\\\BuildTools\\\\VC\\\\Redist\\\\MSVC\\\\[^"\\\\]+\\\\vcredist_x64\\.exe#vcredist_x64.exe#g' bundle/win/Bundle.wxs

        # Ninja
        curl -L https://github.com/ninja-build/ninja/releases/download/v1.10.2/ninja-win.zip -o ninja.zip
        unzip -o ninja.zip
        mv -f ninja.exe build/

        # mpv dev (x86_64-v3 2025-11-16)
        curl -L "https://sourceforge.net/projects/mpv-player-windows/files/libmpv/mpv-dev-x86_64-v3-20251116-git-701201b.7z/download" -o mpv.7z
        7z x mpv.7z
        mkdir -p mpv
        mv include mpv
        gendef libmpv-2.dll
        mv libmpv-2.dll mpv/libmpv-2.dll
        mv libmpv-2.def mpv.def
        mv mpv.def libmpv.dll.a mpv/
        mv mpv build/

    - name: Build
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        cd build
        set PATH=%PATH%;C:\Program Files (x86)\WiX Toolset v3.11\bin;%CD%
        cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX=output -DCMAKE_MAKE_PROGRAM=ninja.exe -DQTROOT=%Qt5_DIR% -DMPV_INCLUDE_DIR=mpv/include -DMPV_LIBRARY=mpv/libmpv-2.dll -DCMAKE_INSTALL_PREFIX=output ..
        lib /def:mpv\mpv.def /out:mpv\libmpv-2.dll.lib /MACHINE:X64
        ninja
        ninja install

        rem Resolve Qt bin path from Qt5_DIR (points to lib\cmake)
        for %%I in ("%Qt5_DIR%\..\..") do set QTBIN=%%~fI\bin

        rem Deploy Qt runtime and required QML modules (QtQuick, WebEngine, WebChannel, Controls)
        %QTBIN%\windeployqt.exe --release --qmldir ..\src\ui output\JellyfinMediaPlayer.exe

        rem Build MSI/EXE (WiX harvest will include files from build/output and bundle/win base path)
        ninja windows_package

    - name: Archive installer
      uses: actions/upload-artifact@v4
      with:
        name: windows
        path: ${{ github.workspace }}/build/JellyfinMediaPlayer-*.exe
