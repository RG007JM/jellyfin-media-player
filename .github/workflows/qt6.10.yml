name: Build Qt6.10 Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - qt6

jobs:
  build-win64:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Remove bundled qt.conf
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item -Force -ErrorAction SilentlyContinue bundle\qt.conf
          Remove-Item -Force -ErrorAction SilentlyContinue bundle\win\qt.conf
          Remove-Item -Force -ErrorAction SilentlyContinue bundle.conf
          Remove-Item -Force -ErrorAction SilentlyContinue bundle.qt.conf

      - name: Nuke MinGW and Path Contamination
        shell: pwsh
        run: |
          $envPath = ($env:Path -split ';' | Where-Object { $_ -notmatch 'mingw' -and $_ -notmatch 'strawberry' })
          [Environment]::SetEnvironmentVariable('Path', ($envPath -join ';'), 'Process')
          Write-Host "Cleaned PATH."

      - name: Prepare Libmpv (User Provided v3 URL)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dep-install\bin, dep-install\lib, dep-install\include | Out-Null

          $url = "https://downloads.sourceforge.net/project/mpv-player-windows/libmpv/mpv-dev-x86_64-v3-20240922-git-71f2220.7z"
          Invoke-WebRequest -Uri $url -OutFile mpv.7z -UserAgent "curl/7.88.1" -MaximumRedirection 10
          7z x mpv.7z -ompv | Out-Null

          Push-Location mpv
          cmd.exe /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" && dumpbin /exports libmpv-2.dll > exports.txt"

          $def = @("LIBRARY libmpv-2.dll", "EXPORTS")
          Get-Content exports.txt | ForEach-Object {
            if ($_ -match '^\s*[0-9A-F]+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)\s*$') { $def += $Matches[1] }
          }
          $def | Set-Content libmpv-2.def -Encoding ASCII

          cmd.exe /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" && lib /def:libmpv-2.def /out:libmpv.lib /MACHINE:X64"

          Copy-Item -Recurse -Force include\* ..\dep-install\include\
          Copy-Item -Force libmpv.lib ..\dep-install\lib\
          Copy-Item -Force libmpv-2.dll ..\dep-install\bin\
          Pop-Location

      - name: Install Qt 6.10.1
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.1
          target: desktop
          arch: win64_msvc2022_64
          modules: qtwebengine qtwebchannel qtmultimedia qtpositioning qtshadertools qtimageformats qtserialport

      - name: Setup Build Environment (Ninja + reuse)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if not exist dep-install mkdir dep-install
          curl -L https://github.com/ninja-build/ninja/releases/download/v1.10.2/ninja-win.zip -o ninja.zip
          tar -xf ninja.zip -C dep-install
          del ninja.zip
          echo %GITHUB_WORKSPACE%\dep-install>>%GITHUB_PATH%
          pip install reuse

      - name: Prepare SDL2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/libsdl-org/SDL/releases/download/release-2.30.0/SDL2-devel-2.30.0-VC.zip" -OutFile sdl2.zip
          Expand-Archive sdl2.zip -DestinationPath sdl2-temp -Force
          $root = (Get-ChildItem sdl2-temp | Select-Object -First 1).FullName

          Copy-Item -Recurse -Force "$root\*" dep-install\
          Copy-Item -Force "$root\lib\x64\SDL2.lib" dep-install\
          Copy-Item -Force "$root\lib\x64\SDL2main.lib" dep-install\
          Copy-Item -Force "$root\lib\x64\SDL2.dll" dep-install\
          Remove-Item -Recurse -Force sdl2-temp, sdl2.zip

      - name: Prepare ECM and MpvQt
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set INSTALLDIR=%GITHUB_WORKSPACE%\dep-install

          git clone https://github.com/KDE/extra-cmake-modules.git
          cd extra-cmake-modules
          cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=%INSTALLDIR%
          ninja -C build install
          cd ..

          git clone --branch v1.0.0 https://github.com/KDE/mpvqt.git
          cd mpvqt
          powershell -Command "$c = Get-Content src\mpvcontroller.h -Raw; $c = $c -replace 'virtual ~MpvController\(\);', ''; $c = $c -replace 'MpvController\(\);', ''; $c = $c.Replace('explicit MpvController(QObject* parent = nullptr);', 'explicit MpvController(QObject* parent = nullptr);' + [Environment]::NewLine + '  virtual ~MpvController() {}'); Set-Content src\mpvcontroller.h $c"
          echo.> src\dummy.cpp
          echo MpvController::MpvController() = default;>> src\dummy.cpp
          cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=%INSTALLDIR% -DCMAKE_PREFIX_PATH=%INSTALLDIR%\lib\cmake;%Qt6_DIR% -DECM_DIR=%INSTALLDIR%\share\ECM\cmake -DCMAKE_CXX_FLAGS="/I%GITHUB_WORKSPACE%\dep-install\include"
          ninja -C build install
          cd ..

      - name: Download Stage VC Redist and OpenSSL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path bundle\win | Out-Null

          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile bundle\win\vcredist_x64.exe

          Invoke-WebRequest -Uri "https://download.firedaemon.com/FireDaemon-OpenSSL/openssl-3.6.0.zip" -OutFile openssl.zip
          Expand-Archive openssl.zip -DestinationPath openssl-temp -Force

          $binPath = (Get-ChildItem -Path openssl-temp -Recurse -Filter libssl-3-x64.dll | Select-Object -First 1).DirectoryName
          Copy-Item -Force (Join-Path $binPath "libssl-3-x64.dll") dep-install\
          Copy-Item -Force (Join-Path $binPath "libcrypto-3-x64.dll") dep-install\

          Remove-Item -Recurse -Force openssl-temp, openssl.zip

      - name: Patch WiX Bundle.wxs (vcredist location)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = "bundle\win\Bundle.wxs"
          if (Test-Path $bundle) {
            $c = Get-Content $bundle -Raw -Encoding UTF8
            $c = $c -replace 'Source="vcredist_x64\.exe"', 'Source="bundle\win\vcredist_x64.exe"'
            $c = $c -replace 'C:\\Program Files \(x86\)\\Microsoft Visual Studio\\2019\\.*?\\VC_redist\.x64\.exe', 'vcredist_x64.exe'
            Set-Content -LiteralPath $bundle -Value $c -Encoding UTF8
          }

      - name: Patch Source Code (NO forced OpenGL; patch out forced OpenGL calls)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # 1) src/CMakeLists.txt: strip mpris/taskbar and Qt6::DBus/Qt6::WinExtras from CI build
          $cmakeFile = "src/CMakeLists.txt"
          $content = Get-Content $cmakeFile -Raw -Encoding UTF8
          $content = [regex]::Replace($content, '(?mi)^\s*add_subdirectory\(\s*mpris\s*\)\s*$', '')
          $content = [regex]::Replace($content, '(?mi)^\s*add_subdirectory\(\s*taskbar\s*\)\s*$', '')
          $content = $content.Replace("Qt6::DBus", "").Replace("Qt6::WinExtras", "")
          Set-Content $cmakeFile $content -Encoding UTF8
          Write-Host "Patched src/CMakeLists.txt (mpris/taskbar removed for CI)."

          # 2) ComponentManager.cpp: strip component references removed above
          $compMgr = "src/core/ComponentManager.cpp"
          if (Test-Path $compMgr) {
            $c = Get-Content $compMgr -Raw -Encoding UTF8
            $c = [regex]::Replace($c, '(?mi)^\s*#include\s+"MprisComponent\.h"\s*$', '')
            $c = [regex]::Replace($c, '(?mi)^\s*#include\s+"TaskbarComponent\.h"\s*$', '')
            $c = [regex]::Replace($c, '(?mi)^\s*#include\s+<.*MprisComponent.*>\s*$', '')
            $c = [regex]::Replace($c, '(?mi)^\s*#include\s+<.*TaskbarComponent.*>\s*$', '')
            $c = [regex]::Replace($c, '(?mi)^\s*.*MprisComponent.*\r?\n', '')
            $c = [regex]::Replace($c, '(?mi)^\s*.*TaskbarComponent.*\r?\n', '')
            Set-Content $compMgr $c -Encoding UTF8
            Write-Host "Patched ComponentManager.cpp (mpris/taskbar refs removed)."
          }

          # 3) WindowManager.cpp: strip taskbar references (if present)
          $winMgr = "src/ui/WindowManager.cpp"
          if (Test-Path $winMgr) {
            $w = Get-Content $winMgr -Raw -Encoding UTF8
            $w = [regex]::Replace($w, '(?mi)^\s*.*TaskbarComponent.*\r?\n', '')
            Set-Content $winMgr $w -Encoding UTF8
            Write-Host "Patched WindowManager.cpp (taskbar refs removed)."
          }

          # 4) Ensure windows.h include in CodecsComponent.cpp
          $codecs = "src/player/CodecsComponent.cpp"
          if (Test-Path $codecs) {
            $cc = Get-Content $codecs -Raw -Encoding UTF8
            if ($cc -notmatch '(?m)^\s*#include\s+<windows\.h>\s*$') {
              $cc = "#include <windows.h>`r`n" + $cc
              Set-Content $codecs $cc -Encoding UTF8
              Write-Host "Patched CodecsComponent.cpp (added windows.h)."
            }
          }

          # 5) Patch src/main.cpp: remove hard-force OpenGL renderer selection (Qt6 should choose; on Windows default is D3D11)
          $main = "src/main.cpp"
          if (Test-Path $main) {
            $m = Get-Content $main -Raw -Encoding UTF8
            $orig = $m

            $m = $m -replace '(?m)^\s*QQuickWindow::setGraphicsApi\(\s*QSGRendererInterface::OpenGL\s*\)\s*;\s*$', ''
            $m = $m -replace '(?m)^\s*QCoreApplication::setAttribute\(\s*Qt::AA_ShareOpenGLContexts\s*\)\s*;\s*$', ''

            if ($m -ne $orig) {
              Set-Content -Path $main -Value $m -Encoding UTF8
              Write-Host "Patched src/main.cpp (removed forced OpenGL graphics API + ShareOpenGLContexts)."
            } else {
              Write-Host "src/main.cpp: no forced OpenGL lines found."
            }
          }

          # 6) Disable qt.conf install generation rules
          $filesToPatch = @("CMakeModules/CPackConfiguration.cmake","CMakeModules/QtConfiguration.cmake")
          foreach ($f in $filesToPatch) {
            if (-not (Test-Path $f)) { continue }
            $t = Get-Content $f -Raw -Encoding UTF8
            $orig = $t
            $t = [regex]::Replace($t, '(?mi)^\s*install\s*\(\s*FILES\s+\$\{CMAKE_SOURCE_DIR\}/bundle/win/qt\.conf\s+DESTINATION\s+\.\s*\)\s*$', '# CI: qt.conf disabled')
            $t = [regex]::Replace($t, '(?mi)^\s*file\s*\(\s*WRITE\s+\$\{QT_ROOT\}/bin/qt\.conf\s+.*$', '# CI: qt.conf disabled')
            if ($t -ne $orig) { Set-Content -Path $f -Value $t -Encoding UTF8 }
          }

      - name: Build Jellyfin Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = (Get-Location).Path
          $depInstall = Join-Path $root "dep-install"
          $libMpv = Join-Path $depInstall "lib\libmpv.lib"
          $incMpv = Join-Path $depInstall "include"
          $mpvQtDir = Join-Path $depInstall "lib\cmake\MpvQt"
          $installPrefix = Join-Path $root "output"

          # Override FindMPV.cmake to use our staged mpv
          $cmakeMod = "CMakeModules/FindMPV.cmake"
          $overrideContent = @"
          set(MPV_FOUND TRUE)
          set(MPV_INCLUDE_DIR "$incMpv")
          set(MPV_LIBRARY "$libMpv")
          set(MPV_LIBRARIES "$libMpv")
          set(MPV_INCLUDE_DIRS "$incMpv")
          
          if(NOT TARGET MPV::MPV)
            add_library(MPV::MPV UNKNOWN IMPORTED)
            set_target_properties(MPV::MPV PROPERTIES
              IMPORTED_LOCATION "$libMpv"
              INTERFACE_INCLUDE_DIRECTORIES "$incMpv"
            )
          endif()
          "@
          Set-Content -Path $cmakeMod -Value $overrideContent -Encoding UTF8

          $qtRootDir = $env:QT_ROOT_DIR
          if (-not $qtRootDir) { throw "QTROOTDIR is not set (install-qt-action env missing)" }

          cmd.exe /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" && cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=`"$installPrefix`" -DCMAKE_PREFIX_PATH=`"$depInstall;$qtRootDir`" -DMpvQt_DIR=`"$mpvQtDir`" ."
          if ($LASTEXITCODE -ne 0) { exit 1 }

          Push-Location build
          cmd.exe /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" && ninja install"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Pop-Location

      - name: Deploy Qt and Finalize (add Safe launcher)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = (Get-Location).Path
          $outDir = Join-Path $root "output"
          if (-not (Test-Path $outDir)) { throw "Output directory missing!" }

          $depInstall = Join-Path $root "dep-install"
          $qtRootDir = $env:QT_ROOT_DIR
          if (-not $qtRootDir) { throw "QTROOTDIR is not set" }

          $qtBin = Join-Path $qtRootDir "bin"
          if (-not (Test-Path $qtBin)) { throw "Qt bin path not found: $qtBin" }

          # Copy a minimal Qt DLL set (kept from your previous workflow)
          $qtDlls = @(
            "Qt6Core.dll","Qt6Gui.dll","Qt6Widgets.dll","Qt6Network.dll",
            "Qt6Quick.dll","Qt6Qml.dll","Qt6Svg.dll","Qt6OpenGL.dll",
            "Qt6QmlModels.dll","Qt6QmlWorkerScript.dll",
            "Qt6WebEngineCore.dll","Qt6WebEngineQuick.dll"
          )
          foreach ($q in $qtDlls) {
            $src = Join-Path $qtBin $q
            if (Test-Path $src) { Copy-Item -Force $src $outDir }
          }

          # WebEngine resources + process
          $resSrc = Join-Path $qtRootDir "resources"
          if (Test-Path $resSrc) {
            New-Item -ItemType Directory -Force -Path (Join-Path $outDir "resources") | Out-Null
            Copy-Item -Force -Recurse (Join-Path $resSrc "*") (Join-Path $outDir "resources")
          }
          $processExe = Join-Path $qtBin "QtWebEngineProcess.exe"
          if (Test-Path $processExe) { Copy-Item -Force $processExe $outDir }

          # mpv + OpenSSL staged DLLs
          Copy-Item -Force (Join-Path $depInstall "bin\libmpv-2.dll") $outDir
          Copy-Item -Force (Join-Path $depInstall "libssl-3-x64.dll") $outDir
          Copy-Item -Force (Join-Path $depInstall "libcrypto-3-x64.dll") $outDir

          # Run windeployqt
          $exePath = Join-Path $outDir "Jellyfin Desktop.exe"
          $qmlArgs = @()
          if (Test-Path (Join-Path $depInstall "lib\qml")) {
            $qmlArgs += "--qmlimport"
            $qmlArgs += (Join-Path $depInstall "lib\qml")
          }

          & (Join-Path $qtBin "windeployqt.exe") --release --force --qmldir src\ui @qmlArgs --compiler-runtime --xml $exePath

          # Remove stray qt.conf files if created
          Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $outDir "qt.conf")
          Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $outDir "qt.qt.conf")

          # Add a Safe launcher (D3D11 RHI)
          @'
          @echo off
          setlocal
          REM Safe renderer choice for Intel/older NVIDIA: use D3D11 RHI
          set QSG_RHI_BACKEND=d3d11
          start "" "%~dp0Jellyfin Desktop.exe" %*
          '@ | Set-Content -Path (Join-Path $outDir "Jellyfin Desktop (Safe).cmd") -Encoding ASCII

          Write-Host "--- Output Dir ---"
          Get-ChildItem $outDir | Select-Object Name

      - name: Create Portable Zip
        shell: pwsh
        run: |
          Compress-Archive -Path output\* -DestinationPath Jellyfin-Desktop-Portable.zip -Force

      - name: Upload Portable Zip
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-desktop-portable
          path: Jellyfin-Desktop-Portable.zip

      - name: Build Installer Package
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set PATH=%PATH%;C:\Program Files (x86)\WiX Toolset v3.11\bin
          cd build
          ninja windows_package

      - name: Archive installer
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-desktop-windows
          path: build/JellyfinDesktop-*.exe
